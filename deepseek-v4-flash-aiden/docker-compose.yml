services:
  ds4:
    image: aidendle94/sparkrun-vllm-ds4-gb10@sha256:3b4d2b5f7929c2b15d25636e3115f343e693a03fe8a57f94969974432c2c4e8d
    container_name: ds4-dspark
    network_mode: host
    ipc: host
    restart: unless-stopped
    shm_size: 32g
    init: true
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    volumes:
      - /home/sdrew/.cache/huggingface:/root/.cache/huggingface
      - /home/sdrew/.cache/vllm-ds4-dspark:/cache
      - /home/sdrew/.cache/tilelang-ds4:/root/.tilelang
      # Official 0731 encoder, bind-mounted directly OVER the image's bundled
      # pre-0731 encoder so vllm loads it at import (see README). NOTE: the
      # DSPARK_ENCODING_FILE env-var hook from MiaAI's launcher is NOT honored
      # by this image — hence this direct file overlay (3.75/3.7 use /opt/venv;
      # 3.8 uses /opt/env).
      - ./encoding_dsv4.py:/opt/venv/lib/python3.12/site-packages/vllm/tokenizers/deepseek_v4_encoding.py:ro
      # Corrected deepseek_v4 tokenizer wrapper (pre-0731 wrapper collapses
      # low->high; this restores low/high/max + off). See README.
      - ./deepseek_v4_wrapper.py:/opt/venv/lib/python3.12/site-packages/vllm/tokenizers/deepseek_v4.py:ro
      # Open-PR backport (tonyd2wild Patch 5, ported): don't evaluate client
      # stop strings inside the reasoning segment. With thinking=true the
      # prompt ends on ` thinking`, and vLLM's v1 detokenizer matching a
      # client stop against the whole stream yields content:null (silent
      # answer loss). Guard arms on the reasoning-start marker and keeps
      # stops dormant until ` response` appears.
      # Opt out: VLLM_SUPPRESS_STOPS_IN_REASONING=0.
      - ./detokenizer.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/engine/detokenizer.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUTE_DSL_ARCH: sm_121a
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.83}
      # ---- RoCE networking (site-specific — match YOUR NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      MN_IF_NAME: "${ETH_IF}"
      CONTROL_IF: "${ETH_IF}"
      OMPI_MCA_btl_tcp_if_include: "${ETH_IF}"
      NCCL_CROSS_NIC: "1"
      NCCL_PROTO: LL,LL128,Simple
      NCCL_P2P_LEVEL: SYS
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      VLLM_HOST_IP: "${ROCE_IP}"
      # ---- runtime ----
      HF_HUB_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "0"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
      # ---- DSpark / memory parity knobs (canonical aiden forum env set;
      #      verified honored by this build via envs.py / dspark speculator) ----
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "off"
      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
      VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "0"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      # KV gets the budget: don't reserve full-CUDA-graph memory in the profiler
      # (372268 #55; perf-pass-1 set). More KV == more long-context concurrency.
      # Revert to "1" only if boot ever OOMs during graph capture.
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      # ---- model / serve ----
      MODEL_PATH: deepseek-ai/DeepSeek-V4-Flash-0731
      MODEL_REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SERVED_MODEL_NAME: deepseek-v4-flash
      PORT: "${PORT:-4000}"
      # GPU memory utilization kept conservative at 0.83 (matches the validated
      # sparkrun port; 1M is comfortably reachable ~3.2x). The aiden forum
      # validated 0.87-0.90 on 3.75 (372268 #677: 0.90 -> 3.1M-token KV pool;
      # #682: 0.85->0.90 = +46% KV) - that headroom is OPTIONAL and can be
      # enabled later if more long-context concurrency is needed. Raised GMU
      # was empirically NOT any faster per-session, and the owner prefers the
      # lower setting after noticing degradation on long sessions with high
      # settings. Do NOT drop toward ~0.78 for "stability" - that number is
      # specific to the NVFP4/tonyd2wild stack.
      GPU_MEM: 0.83
      # DSpark speculative depth. DeepSeek-V4-Flash drafter block = 5, so k must
      # be <=5 or a multiple of 5. On the aiden/fp8 stack the community default
      # is k=4 ("3=balanced, 5=code-heavy", 372268 #513/#687).
      SPEC_TOKENS: 4
      # 0731 official sampling: temp 1.0 / top_p 0.95. reasoning_effort=high is
      # the agentic sweet spot (372268 #520: +7 passes for +5.5% wall time;
      # max = no win + safety regression; low = weaker).
      TEMPERATURE: "1.0"
      TOP_P: "0.95"
      REASONING_EFFORT: high
      TP_SIZE: 2
      MAX_MODEL_LEN: 1048576
      # Agent-serving profile (chunked prefill 2048 / 6 slots): much larger KV
      # pool + decode fairness (validated on the sparkrun port; SvangenStudios
      # 378890; ajvazan 372268 #678 "2048 for better agentic workout"). NOTE:
      # acceptance-optimal batch on this drafter is 8192-16384 (#687) - if
      # acceptance drops under load, raise MAX_NUM_BATCHED_TOKENS. (On the
      # eugr/b12x stack 2048 can crash EngineCore under c4; not seen on aiden.)
      MAX_NUM_SEQS: 6
      MAX_NUM_BATCHED_TOKENS: 2048
      GRAPH_CAP: 256
      # Steady-state decode batch = MAX_NUM_SEQS x (SPEC_TOKENS+1) = 6x5 = 30
      # (36 if you run k=5). The auto-generated capture list omits these; an
      # uncaptured hot shape silently truncates CUDA-graph replay under
      # concurrency (RUNTIME-BAKEOFF + PR#5: ~+9-14% at c4-c6).
      CUDAGRAPH_CAPTURE_SIZES: "[1,2,4,8,16,24,30,32,36,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]"
      ASYNC_SCHED: 1

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"

    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        unset NCCL_GRAPH_FILE NCCL_GRAPH_DUMP_FILE VLLM_B12X_MLA_EXTEND_MAX_CHUNKS
        export VLLM_ENABLE_PCIE_ALLREDUCE=0 VLLM_PCIE_ALLREDUCE_BACKEND=cpp

        # Auto-detect the RoCE-v2 IPv4 GID index (it re-numbers across reboots).
        for HCA in $(echo "$${NCCL_IB_HCA}" | tr ',' ' '); do
          for i in $(seq 0 15); do
            t=$(cat /sys/class/infiniband/$$HCA/ports/1/gid_attrs/types/$$i 2>/dev/null || true)
            g=$(cat /sys/class/infiniband/$$HCA/ports/1/gids/$$i 2>/dev/null || true)
            case "$$t" in *"RoCE v2"*) case "$$g" in *0000:0000:0000:0000:0000:ffff:*) export NCCL_IB_GID_INDEX=$$i; break 2;; esac;; esac
          done
        done

        echo "[dspark] NODE_RANK=$${NODE_RANK} SPEC=dspark/$${SPEC_TOKENS} GID=$${NCCL_IB_GID_INDEX}"

        if [ "$${ASYNC_SCHED:-1}" = "1" ]; then ASYNC_ARG="--async-scheduling"; else ASYNC_ARG=""; fi

        exec vllm serve "$${MODEL_PATH}" \
          --revision "$${MODEL_REVISION:-main}" \
          --served-model-name "$${SERVED_MODEL_NAME:-deepseek-v4-flash}" \
          --host 0.0.0.0 --port "$${PORT}" --trust-remote-code \
          --kv-cache-dtype fp8 --block-size 256 --load-format auto \
          --tensor-parallel-size "$${TP_SIZE}" \
          --gpu-memory-utilization "$${GPU_MEM}" \
          --max-model-len "$${MAX_MODEL_LEN}" --max-num-seqs "$${MAX_NUM_SEQS}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS}" \
          --max-cudagraph-capture-size "$${GRAPH_CAP}" \
          --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"cudagraph_capture_sizes":$${CUDAGRAPH_CAPTURE_SIZES}}' \
          $${ASYNC_ARG} --no-scheduler-reserve-full-isl \
          --enable-chunked-prefill --enable-prefix-caching --enable-flashinfer-autotune \
          --tokenizer-mode deepseek_v4 --tool-call-parser deepseek_v4 --reasoning-parser deepseek_v4 \
          --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":" thinking","reasoning_end_str":" response"}' \
          --enable-auto-tool-choice \
          --generation-config vllm \
          --default-chat-template-kwargs.temperature=$${TEMPERATURE} \
          --default-chat-template-kwargs.top_p=$${TOP_P} \
          --default-chat-template-kwargs.thinking=true --default-chat-template-kwargs.reasoning_effort=$${REASONING_EFFORT} \
          --attention-backend FLASHINFER_MLA_SPARSE_DSV4 --moe-backend b12x \
          --disable-custom-all-reduce \
          --nnodes 2 --node-rank "$${NODE_RANK}" --master-addr "$${MASTER_ADDR}" --master-port 25000 \
          $${HEADLESS:+--headless} \
          --speculative-config "{\"method\":\"dspark\",\"num_speculative_tokens\":$${SPEC_TOKENS},\"draft_sample_method\":\"probabilistic\",\"moe_backend\":\"b12x\"}"
