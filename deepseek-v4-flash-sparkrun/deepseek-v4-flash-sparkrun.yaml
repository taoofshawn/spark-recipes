# Sparkrun recipe: DeepSeek V4 Flash 0731 (b12x) on a 2-node DGX Spark cluster
#
# This is the sparkrun-native port of the eugr b12x recipe. It is built and
# launched ENTIRELY through sparkrun:
#   - sparkrun's eugr builder detects `build_args` and drives eugr's
#     build-and-copy.sh -t vllm-node-b12x --exp-b12x (the full source build),
#   - `mods:` are resolved adjacent to this file (see mods/ dir here),
#   - sparkrun distributes the image + model and launches both nodes.
#
# Run on the leader node:
#   sparkrun run deepseek-v4-flash-sparkrun/deepseek-v4-flash-sparkrun.yaml
#   (or:  sparkrun run ./deepseek-v4-flash-sparkrun.yaml)
#
# Note on templating: sparkrun substitutes `{key}` from `defaults` with a
# plain regex (arg_substitute), so JSON-valued flags live as single defaults
# values (e.g. speculative_config) rather than eugr-style `{{...}}` escapes.

recipe_version: "2"
name: deepseek-v4-flash-sparkrun
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-0731 on dual Sparks via the B12X stack

model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm
container: vllm-node-b12x

# Full source build via eugr's build-and-copy.sh (sparkrun drives it).
build_args:
  - --exp-b12x

cluster_only: true
min_nodes: 2
max_nodes: 2

mods:
  - mods/instanttensor-hybrid-draft-loader
  - mods/dsv4-reasoning-effort-fix

metadata:
  description: DeepSeek V4 Flash 0731, 1M context, B12X MoE/MLA, DSpark speculative decoding
  maintainer: sdrew

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: auto
  block_size: 256
  max_num_seqs: 6
  max_num_batched_tokens: 10240
  max_cudagraph_capture_size: 64
  served_model_name: deepseek-v4-flash
  num_speculative_tokens: 5
  reasoning_effort: high
  # JSON flags as single defaults values (sparkrun arg_substitute-friendly)
  reasoning_config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
  generation_config: '{"temperature":0.95,"top_p":0.44,"repetition_penalty":1.05}'
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
  speculative_config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"
  # Never touch the HF Hub — the model is served from the local cache on both nodes.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

command: |
  vllm serve {model} \
      --host {host} \
      --port {port} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{reasoning_config}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort={reasoning_effort} \
      --override-generation-config '{generation_config}' \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --enable-chunked-prefill \
      --no-scheduler-reserve-full-isl \
      --compilation-config '{compilation_config}' \
      --speculative-config '{speculative_config}'
