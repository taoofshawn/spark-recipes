services:
  ds4:
    image: vllm-dspark-runtime:dspark-nvfp4-stage-c
    container_name: ds4-dspark
    network_mode: host
    ipc: host
    restart: unless-stopped
    shm_size: 64g
    init: true
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${HF_CACHE:-/home/sdrew/.cache/huggingface}:/cache/huggingface
      # NODE-LOCAL JIT/compile caches — deliberately a SEPARATE mount from
      # HF_CACHE (upstream issue #27). Seven caches are written concurrently
      # by both ranks; if they land on a shared (NFS) HF cache the failures
      # are serial and misleading — torch.compile makedirs races, DeepGEMM
      # "runtime != nullptr" from half-written cubins, and an ABI-mismatched
      # FlashInfer sampling.so built by one node and silently loaded by the
      # other (silent because the stack runs FLASHINFER_DISABLE_VERSION_CHECK=1).
      # Keep JIT_CACHE_DIR on local disk on every node.
      - ${JIT_CACHE_DIR:-/home/sdrew/.cache/vllm-dspark}:/vllm-cache
      # Reasoning-effort + tool-argument hardening overlay (from the aiden fix):
      # 1) this image's stock encoder only accepts high/max reasoning_effort (`low`
      #    asserts). Overlay the corrected 3-level encoder (low/high/max) so effort
      #    routing works and matches the official 0731 semantics.
      # 2) adds tool-argument JSON repair/normalization so model tool calls survive
      #    as valid JSON (wrapper keys, truncated/malformed args).
      - ./encoding_dsv4.py:/opt/env/lib/python3.12/site-packages/vllm/tokenizers/deepseek_v4_encoding.py:ro
      - ./deepseek_v4_wrapper.py:/opt/env/lib/python3.12/site-packages/vllm/tokenizers/deepseek_v4.py:ro
      # Open-PR backport (tonyd2wild Patch 5): don't evaluate client stop strings
      # inside the reasoning segment. vLLM's v1 detokenizer matches client `stop`
      # against the whole stream; with think-in-prompt the model starts inside
      # ` thinking` and a stop firing mid-reasoning yields content:null (a silent
      # answer loss). Guard arms when the prompt ends on the reasoning-start
      # marker and keeps stops dormant until ` response` appears.
      # Opt out: VLLM_SUPPRESS_STOPS_IN_REASONING=0.
      - ./detokenizer.py:/opt/env/lib/python3.12/site-packages/vllm/v1/engine/detokenizer.py:ro
      # fastokens runtime hook: honors VLLM_USE_FASTOKENS=1 by calling
      # fastokens.patch_transformers() at interpreter start. This image's vLLM
      # (0.21.x fork) defines the env var in its envs.py overlay but has no
      # consumer for it (0.21 only ships --tokenizer-mode fastokens, which
      # would drop the deepseek_v4 wrapper). The hook swaps the inner Rust BPE
      # backend of the HF fast tokenizer while keeping the deepseek_v4
      # wrapper/encoder overlays intact. Opt out: VLLM_USE_FASTOKENS=0.
      - ./sitecustomize.py:/opt/env/lib/python3.12/site-packages/sitecustomize.py:ro
      # Open-PR backport (tonyd2wild PR #17): streaming tool-parser fix. The stock
      # parser passed an explicit empty tool_calls=[] on every content delta once a
      # request carries tools; with exclude_unset=True that emits `"tool_calls": []`
      # (truthy in JS), so agent clients route text into the tool-call branch and
      # drop the answer. DeepSeekV4ToolParser subclasses this V3.2 parser, so this
      # overlay fixes both.
      # Patch A (upstream campaign-2026-08-20): drafter-private cudagraph capture
      # sizes — fixes a genuine fork bug where a batch-1 DSpark draft ran padded
      # to 20 draft tokens/step instead of 5 (shared target capture sizes rounded
      # to multiples of 1+k). +3.0% single-stream decode, quality probes
      # byte-identical. Env-gated: VLLM_DSPARK_DRAFT_CAPTURE_SIZES=1 enables;
      # default off = byte-identical to stock. Costs ~2.5 GB at profiling — pair
      # with GPU_MEM 0.78 (see campaign STACK).
      - ./patches/A-drafter-sizes/v1/spec_decode/dspark_proposer.py:/opt/env/lib/python3.12/site-packages/vllm/v1/spec_decode/dspark_proposer.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # ---- RoCE networking (site-specific — match YOUR NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      VLLM_HOST_IP: "${ROCE_IP}"
      # ---- runtime (Stage-C NVFP4 overlay image) ----
      HF_HOME: /cache/huggingface
      # All seven JIT/workspace caches point at the node-local /vllm-cache
      # volume above, NOT at the HF cache tree (upstream issue #27). The set
      # matters — they were found one crash at a time.
      VLLM_CACHE_ROOT: /vllm-cache
      DG_JIT_CACHE_DIR: /vllm-cache/deepgemm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TORCHINDUCTOR_CACHE_DIR: /vllm-cache/torchinductor-cache
      TRITON_CACHE_DIR: /vllm-cache/triton-cache
      TORCH_EXTENSIONS_DIR: /vllm-cache/torch_extensions
      # Engine-ready timeout. The stock 600 s trips torch.distributed teardown
      # on a warm restart of this model (loads 155 GiB across two nodes); the
      # second startup then dies with no useful error. 3600 matches the
      # sparkrun profile (upstream PR #19) — this is the compose-side mirror.
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      # Never touch the HF Hub — the model is served from the local cache
      # on both nodes (156G snapshot pinned by MODEL_REVISION).
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      DSPARK_SLOT_CLAMP: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
      # B12X decode tuning knobs added upstream (Validated C12 profile).
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: ""
      B12X_W4A16_TC_DECODE: "0"
      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: off
      VLLM_DSPARK_LOCAL_ARGMAX: "1"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
      # Fused-Markov argmax enabled + Patch A (campaign-2026-08-20 STACK winner):
      # +5-9% c4 aggregate (one Triton kernel per draft pos vs three), neutral
      # single-stream, quality 6/6 byte-identical. Costs ~1.5 GB at profiling.
      VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "1"
      VLLM_DSPARK_DRAFT_CAPTURE_SIZES: "1"
      VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "1"
      VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: "0"
      VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "1"
      VLLM_DSV4_B12X_COMPRESSED_MLA: "0"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: "0"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: "0"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /opt/env/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # ---- model / serve ----
      MODEL_PATH: deepseek-ai/DeepSeek-V4-Flash-0731
      MODEL_REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SERVED_MODEL_NAME: deepseek-v4-flash
      PORT: "${PORT:-4000}"
      # Campaign-2026-08-20 STACK winner (Patch A + fused-Markov) validated at
      # gmu 0.78 / seq 6 — README-validated lane; 0.80+ is the flagged
      # boots-then-dies edge; Patch A costs ~2.5 GB headroom. ~1.38M-token KV
      # pool. Re-tune upward (0.80 / seq 12) only after a gated bring-up.
      GPU_MEM: 0.78
      MTP_NUM_TOKENS: 5
      TP_SIZE: 2
      MAX_MODEL_LEN: 1048576
      MAX_NUM_SEQS: 6
      MAX_NUM_BATCHED_TOKENS: 8192
      KV_CACHE_DTYPE: nvfp4_ds_mla
      # fastokens shim: swap the HF fast-tokenizer Rust BPE backend for the
      # crusoecloud fastokens package (10x+ faster tokenize; TTFT win at large
      # context). Installed at boot if missing (see command block); applied by
      # the bind-mounted sitecustomize.py. Opt out: VLLM_USE_FASTOKENS=0.
      VLLM_USE_FASTOKENS: "1"
      THINKING: true
      REASONING_EFFORT: high
      ASYNC_SCHED: 1

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        export PATH="/opt/env/bin:/opt/env/nvvm/bin:/opt/env/targets/sbsa-linux/nvvm/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/opt/env/targets/sbsa-linux}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/opt/env/lib:/opt/env/targets/sbsa-linux/lib:$${LD_LIBRARY_PATH:-}";

        # Auto-detect the RoCE-v2 IPv4 GID index unless one is set in .env.
        if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
          for HCA in $(echo "$${NCCL_IB_HCA}" | tr ',' ' '); do
            for i in $(seq 0 15); do
              t=$(cat /sys/class/infiniband/$$HCA/ports/1/gid_attrs/types/$$i 2>/dev/null || true)
              g=$(cat /sys/class/infiniband/$$HCA/ports/1/gids/$$i 2>/dev/null || true)
              case "$$t" in *"RoCE v2"*) case "$$g" in *0000:0000:0000:0000:0000:ffff:*) export NCCL_IB_GID_INDEX=$$i; break 2;; esac;; esac
            done
          done
        fi

        echo "[dspark] NODE_RANK=$${NODE_RANK} MTP=$${MTP_NUM_TOKENS} GID=$${NCCL_IB_GID_INDEX}"

        if [ "$${ASYNC_SCHED:-1}" = "1" ]; then ASYNC_ARG="--async-scheduling"; else ASYNC_ARG=""; fi
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS:-5},\"draft_sample_method\":\"probabilistic\",\"moe_backend\":\"b12x\"}";

        # fastokens: install on first boot if VLLM_USE_FASTOKENS=1 and the
        # package is missing. Kept out of the vendored upstream Dockerfile —
        # this is the recipe-level customization layer. The bind-mounted
        # sitecustomize.py applies the shim at interpreter start, before vLLM
        # loads the deepseek_v4 tokenizer.
        if [ "$${VLLM_USE_FASTOKENS:-0}" = "1" ]; then
          if /opt/env/bin/python -c 'import fastokens' >/dev/null 2>&1; then
            echo "[fastokens] fastokens already installed"
          else
            echo "[fastokens] installing fastokens (VLLM_USE_FASTOKENS=1)..."
            /opt/env/bin/python -m pip install --no-cache-dir 'fastokens>=0.2.0'
            if ! /opt/env/bin/python -c 'import fastokens' >/dev/null 2>&1; then
              echo "[fastokens] FATAL: fastokens could not be installed (offline?); VLLM_USE_FASTOKENS=1 requires it." >&2
              echo "[fastokens] Unset VLLM_USE_FASTOKENS or pre-install fastokens into the image." >&2
              exit 1
            fi
            echo "[fastokens] installed"
          fi
        fi

        exec /opt/env/bin/vllm serve "$${MODEL_PATH}" \
          --revision "$${MODEL_REVISION:-main}" \
          --served-model-name "$${SERVED_MODEL_NAME:-deepseek-v4-flash-dspark}" \
          --host 0.0.0.0 --port "$${PORT:-8888}" --trust-remote-code \
          --tensor-parallel-size "$${TP_SIZE:-2}" --pipeline-parallel-size 1 \
          --kv-cache-dtype "$${KV_CACHE_DTYPE:-nvfp4_ds_mla}" --block-size 256 \
          --max-model-len "$${MAX_MODEL_LEN:-1048576}" --max-num-seqs "$${MAX_NUM_SEQS:-12}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS:-8192}" \
          --gpu-memory-utilization "$${GPU_MEM:-0.78}" --enable-prefix-caching \
          $${ASYNC_ARG} --enable-chunked-prefill \
          --speculative-config "$${SPECULATIVE_CONFIG}" \
          --tokenizer-mode deepseek_v4 --distributed-executor-backend mp \
          --tool-call-parser deepseek_v4 --enable-auto-tool-choice \
          --reasoning-parser deepseek_v4 \
          --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":" thinking","reasoning_end_str":" response"}' \
          --default-chat-template-kwargs "{\"thinking\":$${THINKING:-true},\"reasoning_effort\":\"$${REASONING_EFFORT:-high}\"}" \
          --generation-config vllm \
          --override-generation-config '{"temperature":1.0,"top_p":0.95}' \
          --enable-flashinfer-autotune \
          --nnodes 2 --node-rank "$${NODE_RANK}" --master-addr "$${MASTER_ADDR}" --master-port "$${MASTER_PORT:-25000}" \
          $${HEADLESS:+--headless}
