# DeepSeek-V4-Flash-Vision-Exp (native vision, vLLM 0.28.1rc1 B12X) — 2x DGX Spark, port 8000.
# Adoption of 0rand/DeepSeek-v4-flash-ver-2sparks-vllm-029-0rand (upstream @ 74e9f11,
# 2026-09-09) into this repo's docker-compose conventions: shared .env +
# per-node .env.node0/.env.node1, GID auto-detect, worker-first start.
# The image is a from-scratch build (Dickson's build of the PilcoTHINK Dockerfile
# lane @ 38db013b) with native vision + DSpark + B12X baked in — no runtime hotfix
# chain, no patch mounts. It additionally bakes in the upstream DeepSeek V4
# tool-call parser fix (vLLM d98c8c03), which the earlier 0rand image lacks.
# Upstream's deliberate serving choices are preserved; deviations are
# documented in README.md ("Cluster deviations").
services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE}
    container_name: ds4v-0rand-dspark
    pull_policy: if_not_present
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"
    restart: unless-stopped
    stop_grace_period: 10s
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$HEADLESS\" ]; then exit 0; fi; curl -fsS http://127.0.0.1:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      # Model weights (HF hub tree; Vision-Exp snapshot cached on both ranks).
      - ${HF_CACHE:-/home/sdrew/.cache/huggingface}:/cache/huggingface
      # JIT/compile caches (node-local only; this image JITs B12X/CUTLASS
      # kernels and both ranks write concurrently).
      - ${JIT_CACHE_DIR:-/home/sdrew/.cache/vllm-dspark-0rand}:/vllm-cache
      # Vendored upstream mods (read-only). run.sh patches container
      # site-packages at boot when FIX_MM_PREFIX_SPAN=1 (see research.md).
      - ./mods:/mods:ro
    environment:
      # ---- GPU (one per node; TP=2 across the pair) ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # ---- RoCE networking (this cluster's NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      VLLM_HOST_IP: "${ROCE_IP}"
      # ---- runtime (0rand vLLM 0.29-b12x image preflight requirements) ----
      # The image's verify_deepseek_vision_dspark.py hard-requires this pair;
      # docker run -e overrides image ENV, so pin both explicitly.
      VLLM_USE_AOT_COMPILE: "0"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      # JIT/workspace caches on the node-local volume.
      VLLM_CACHE_ROOT: /vllm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TRITON_CACHE_DIR: /vllm-cache/triton
      B12X_CUTE_COMPILE_CACHE_DIR: /vllm-cache/b12x-cute
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # ---- model / serve ----
      DSPARK_MODEL: "${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}"
      DSPARK_REVISION: "${DSPARK_REVISION:-}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-deepseek-v4-flash}"
      VLLM_PORT: "${PORT:-8000}"
      VLLM_HOST: 0.0.0.0
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.87}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-1048576}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-8}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-4096}"
      MAX_CUDAGRAPH_CAPTURE_SIZE: "${MAX_CUDAGRAPH_CAPTURE_SIZE:-48}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-6}"
      DRAFT_SAMPLE_METHOD: "${DRAFT_SAMPLE_METHOD:-probabilistic}"
      # Sampling defaults — repo-parity pins (temp 1.0 / top_p 0.95, thinking
      # ON at REASONING_EFFORT). Clients override per request via
      # chat_template_kwargs / the OpenAI reasoning_effort field.
      TEMPERATURE: "${TEMPERATURE:-1.0}"
      TOP_P: "${TOP_P:-0.95}"
      THINKING: "${THINKING:-true}"
      REASONING_EFFORT: "${REASONING_EFFORT:-high}"
      LIMIT_MM_PER_PROMPT: "${LIMIT_MM_PER_PROMPT:-image=10}"
      # Opt-in V2-runner vision-grounding fix (upstream PR #1, merged
      # d0c8584 2026-09-12): applies the vendored mm-prefix span mod at
      # boot. Default OFF (upstream default too) — see README + research.md.
      FIX_MM_PREFIX_SPAN: "${FIX_MM_PREFIX_SPAN:-0}"
      # ---- multi-node ----
      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export PATH="/usr/local/cuda/bin:/usr/local/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/usr/local/cuda}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";

        # Auto-detect the RoCE-v2 IPv4 GID index unless one is set in .env.
        if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
          for HCA in $(echo "$${NCCL_IB_HCA}" | tr ',' ' '); do
            for i in $(seq 0 15); do
              t=$(cat /sys/class/infiniband/$$HCA/ports/1/gid_attrs/types/$$i 2>/dev/null || true)
              g=$(cat /sys/class/infiniband/$$HCA/ports/1/gids/$$i 2>/dev/null || true)
              case "$$t" in *"RoCE v2"*) case "$$g" in *0000:0000:0000:0000:0000:ffff:*) export NCCL_IB_GID_INDEX=$$i; break 2;; esac;; esac
            done
          done
        fi
        echo "[ds4v-0rand] NODE_RANK=$${NODE_RANK} MTP=$${MTP_NUM_TOKENS} GID=$${NCCL_IB_GID_INDEX}"

        # DSpark: k MUST be divisible by the drafter's n_predict=3 (pydantic
        # validator rejects 5); k=6 is upstream's validated value (k=3 was
        # found to degrade thinking).
        case "$${DRAFT_SAMPLE_METHOD:-probabilistic}" in
          probabilistic|greedy) DRAFT_SAMPLE_METHOD="$${DRAFT_SAMPLE_METHOD:-probabilistic}" ;;
          *) echo "DRAFT_SAMPLE_METHOD must be one of: probabilistic, greedy (got: $${DRAFT_SAMPLE_METHOD})" >&2; exit 2 ;;
        esac;
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"model\":\"$${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS:-6},\"draft_sample_method\":\"$${DRAFT_SAMPLE_METHOD}\",\"attention_backend\":\"FLASHINFER_MLA_SPARSE_DSV4\",\"enable_adaptive_verification\":false}";

        # Sampling defaults — repo parity: thinking ON at REASONING_EFFORT,
        # temp 1.0 / top_p 0.95 (same values as the aiden/glm recipes).
        case "$${THINKING:-true}" in
          true|false) ;;
          *) echo "THINKING must be true or false (got: $${THINKING})" >&2; exit 2 ;;
        esac;
        case "$${REASONING_EFFORT:-high}" in
          low|high|max) ;;
          *) echo "REASONING_EFFORT must be one of: low, high, max (got: $${REASONING_EFFORT})" >&2; exit 2 ;;
        esac;
        DEFAULT_CHAT_TEMPLATE_KWARGS="{\"thinking\":$${THINKING:-true},\"reasoning_effort\":\"$${REASONING_EFFORT:-high}\"}";
        GEN_CFG="{\"temperature\":$${TEMPERATURE:-1.0},\"top_p\":$${TOP_P:-0.95}}";

        REVISION_ARGS="";
        if [ -n "$${DSPARK_REVISION:-}" ]; then REVISION_ARGS="--revision $${DSPARK_REVISION}"; fi;
        LIMIT_MM_RAW='${LIMIT_MM_PER_PROMPT:-image=10}'; case "$${LIMIT_MM_RAW}" in image=*) _lim_n="$${LIMIT_MM_RAW#image=}"; case "$${_lim_n}" in ''|*[!0-9]*) echo "error: LIMIT_MM_PER_PROMPT image=N needs an integer" >&2; exit 2 ;; esac; LIMIT_MM_JSON="{\"image\":$${_lim_n}}" ;; *) LIMIT_MM_JSON="$${LIMIT_MM_RAW}" ;; esac; LIMIT_MM_ARGS=(--limit-mm-per-prompt "$${LIMIT_MM_JSON}");

        # Opt-in vision-grounding fix (upstream PR #1, merged d0c8584):
        # Python-only patch of the V2 runner's mm-prefix span derivation
        # (attn_utils.py + model_states/default.py). Idempotent, dry-run
        # guarded; failure is fatal by design (an explicitly requested fix
        # must not be silently missing).
        if [ "$${FIX_MM_PREFIX_SPAN:-0}" = "1" ]; then
          # via bash: upstream stores run.sh non-executable (100644) and the
          # mount is read-only, so direct exec would fail on the nodes.
          bash /mods/fix-dsv4-mm-prefix-span/run.sh
        fi

        exec vllm serve "$${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}" \
          $${REVISION_ARGS} \
          --served-model-name "$${SERVED_MODEL_NAME:-deepseek-v4-flash}" \
          --host "$${VLLM_HOST:-0.0.0.0}" --port "$${VLLM_PORT:-8000}" --trust-remote-code \
          --tensor-parallel-size 2 \
          --kv-cache-dtype fp8 --block-size 256 \
          --max-model-len "$${MAX_MODEL_LEN:-1048576}" --max-num-seqs "$${MAX_NUM_SEQS:-8}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS:-4096}" \
          --max-cudagraph-capture-size "$${MAX_CUDAGRAPH_CAPTURE_SIZE:-48}" \
          --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION:-0.87}" \
          --enable-prefix-caching --enable-chunked-prefill \
          --skip-mm-profiling \
          "$${LIMIT_MM_ARGS[@]}" \
          --tokenizer-mode deepseek_v4 \
          --tool-call-parser deepseek_v4 --enable-auto-tool-choice \
          --reasoning-parser deepseek_v4 \
          --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
          --default-chat-template-kwargs "$${DEFAULT_CHAT_TEMPLATE_KWARGS}" \
          --generation-config vllm --override-generation-config "$${GEN_CFG}" \
          --moe-backend b12x --linear-backend b12x \
          --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
          --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
          --speculative-config "$${SPECULATIVE_CONFIG}" \
          --nnodes 2 --node-rank "$${NODE_RANK}" --master-addr "$${MASTER_ADDR}" --master-port "$${MASTER_PORT:-25000}" \
          $${HEADLESS:+--headless}
