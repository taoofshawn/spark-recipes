# DeepSeek-V4-Flash-Vision-Exp (native vision) — 2x DGX Spark, port 4000.
# Adoption of MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark into this repo's
# docker-compose conventions (shared .env + per-node .env.node0/.env.node1,
# GID auto-detect, worker-first start). All hotfixes are vendored in ./patches/
# and mounted read-only; the command block applies them at boot exactly like
# upstream. Provenance + constraint matrix: README.md.
services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE:-ghcr.io/anemll/dspark-vllm-gx10:0.1.1}
    container_name: ds4v-miaai-dspark
    pull_policy: if_not_present
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"
    restart: unless-stopped
    stop_grace_period: 10s
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$HEADLESS\" ]; then exit 0; fi; curl -fsS http://127.0.0.1:${PORT:-4000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 480s
    volumes:
      # Model weights + JIT caches (both node-local on this cluster; the
      # Vision-Exp snapshot is cached on both ranks).
      - ${HF_CACHE:-/home/sdrew/.cache/huggingface}:/cache/huggingface
      - ${JIT_CACHE_DIR:-/home/sdrew/.cache/vllm-dspark-miaai}:/vllm-cache
      # GB10 hybrid NVFP4 plugin (opt-in via ENABLE_VLLM_GB10_PATCH=1).
      - ./vllm_patch_gb10:/opt/vllm-gb10-hybrid-nvfp4
      # All hotfix sources (mounts below expose the individual .py files that
      # the command block runs; this dir is where the .sh hotfixes live).
      - ./patches:/opt/dspark-patches:ro
      - ./patches/hotfix-encoding-dsv4-issue21.py:/opt/hotfix-encoding-dsv4-issue21.py:ro
      - ./patches/hotfix-dsv4-issue31-v2-thinking-budget-gpu.py:/opt/hotfix-dsv4-issue31-v2-thinking-budget-gpu.py:ro
      - ./patches/hotfix-dsv4-issue55-tool-truncation.py:/opt/hotfix-dsv4-issue55-tool-truncation.py:ro
      - ./patches/hotfix-vllm-empty-encoder-output.py:/opt/hotfix-vllm-empty-encoder-output.py:ro
      - ./patches/hotfix-dsv4-issue27-partial-prefill-concurrency.py:/opt/hotfix-dsv4-issue27-partial-prefill-concurrency.py:ro
      - ./patches/hotfix-dsv4-issue43-decode-fairness-and-diag.py:/opt/hotfix-dsv4-issue43-decode-fairness-and-diag.py:ro
      - ./patches/hotfix-dsv4-issue26-hybrid-swa-min.py:/opt/hotfix-dsv4-issue26-hybrid-swa-min.py:ro
      - ./patches/hotfix-dsv4-issue133-triton-specialization.py:/opt/hotfix-dsv4-issue133-triton-specialization.py:ro
      - ./patches/hotfix-dsv4-issue141-sparse-mla-decode-chunk.py:/opt/hotfix-dsv4-issue141-sparse-mla-decode-chunk.py:ro
      - ./patches/hotfix-vllm-issue136-xgrammar-termination.py:/opt/hotfix-vllm-issue136-xgrammar-termination.py:ro
      - ./patches/hotfix-dsv4-suppress-stops-in-reasoning.py:/opt/hotfix-dsv4-suppress-stops-in-reasoning.py:ro
      - ./patches/hotfix-dsv4-assistant-final-continuation.py:/opt/hotfix-dsv4-assistant-final-continuation.py:ro
      - ./patches/hotfix-dsv4-vision-exp.py:/opt/hotfix-dsv4-vision-exp.py:ro
      - ./patches/hotfix-vllm-issue138-responses-history.py:/opt/hotfix-vllm-issue138-responses-history.py:ro
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # ---- RoCE networking (site-specific — match YOUR NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-}"
      NCCL_NET_GDR_LEVEL: "${NCCL_NET_GDR_LEVEL:-}"
      NCCL_NET_GDR_READ: "${NCCL_NET_GDR_READ:-}"
      NCCL_DMABUF_ENABLE: "${NCCL_DMABUF_ENABLE:-}"
      VLLM_HOST_IP: "${ROCE_IP}"
      # ---- runtime (Anemll DSpark vLLM GX10 image) ----
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      # JIT/workspace caches on the node-local /vllm-cache volume (upstream
      # issue #27 family — found one crash at a time).
      VLLM_CACHE_ROOT: /vllm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TRITON_CACHE_DIR: /vllm-cache/triton
      B12X_CUTE_COMPILE_CACHE_DIR: /vllm-cache/b12x-cute
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      CUTE_DSL_ARCH: sm_121a
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_B12X_MOE: "1"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: ""
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      # Flight recorder (incident response): persist dumps on the HF volume.
      TORCH_FR_BUFFER_SIZE: "2000"
      TORCH_NCCL_DUMP_ON_TIMEOUT: "1"
      TORCH_NCCL_ENABLE_MONITORING: "1"
      TORCH_FR_DUMP_TEMP_FILE: /cache/huggingface/nccl-fr/comm_lib_trace_rank_
      TORCH_NCCL_DEBUG_INFO_PIPE_FILE: /tmp/fr_dump_pipe_
      # ---- model / serve ----
      DSPARK_MODEL: "${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}"
      DSPARK_REVISION: "${DSPARK_REVISION:-}"
      DSPARK_ENCODING_FILE: "${DSPARK_ENCODING_FILE:-}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-deepseek-v4-flash}"
      VLLM_PORT: "${PORT:-4000}"
      VLLM_HOST: 0.0.0.0
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.83}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-1048576}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-6}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-8192}"
      LONG_PREFILL_TOKEN_THRESHOLD: "${LONG_PREFILL_TOKEN_THRESHOLD:-1024}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-6}"
      DRAFT_SAMPLE_METHOD: "${DRAFT_SAMPLE_METHOD:-probabilistic}"
      DEFAULT_THINKING: "${DEFAULT_THINKING:-low}"
      LIMIT_MM_PER_PROMPT: "${LIMIT_MM_PER_PROMPT:-image=8}"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      DSPARK_ISSUE43_SCHED_DIAG: "0"
      DSPARK_MAX_INFLIGHT_PREFILLS: "${DSPARK_MAX_INFLIGHT_PREFILLS:-1}"
      # Hotfix toggles (all default off except the always-on chain; see README).
      DSPARK_SKIP_HOTFIX: "0"
      DSPARK_SKIP_ISSUE22_HOTFIX: "0"
      DSPARK_SKIP_SPIN_WAIT_HOTFIX: "0"
      DSPARK_SKIP_ISSUE117_RECHECK_HOTFIX: "0"
      DSPARK_SUPPRESS_STOPS_IN_REASONING: "1"
      DSPARK_SKIP_SUPPRESS_STOPS_HOTFIX: "0"
      DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX: "0"
      DSPARK_ENABLE_ISSUE138_RESPONSES_HISTORY_COMPAT: "0"
      DSPARK_ENABLE_ISSUE141_SPARSE_MLA_CHUNK: "0"
      DSPARK_ENABLE_ISSUE136_XGRAMMAR_HOTFIX: "0"
      DSPARK_ENABLE_ISSUE31_GPU_HOTFIX: "0"
      ENABLE_VLLM_GB10_PATCH: "0"
      VLLM_PLUGINS: ""
      # Optional auth: VLLM_API_KEY (single) or DSPARK_API_KEYS (space-separated).
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      DSPARK_API_KEYS: "${DSPARK_API_KEYS:-}"
      # ---- multi-node ----
      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export PATH="/usr/local/cuda/bin:/usr/local/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/usr/local/cuda}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";

        # Auto-detect the RoCE-v2 IPv4 GID index unless one is set in .env.
        if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
          for HCA in $(echo "$${NCCL_IB_HCA}" | tr ',' ' '); do
            for i in $(seq 0 15); do
              t=$(cat /sys/class/infiniband/$$HCA/ports/1/gid_attrs/types/$$i 2>/dev/null || true)
              g=$(cat /sys/class/infiniband/$$HCA/ports/1/gids/$$i 2>/dev/null || true)
              case "$$t" in *"RoCE v2"*) case "$$g" in *0000:0000:0000:0000:0000:ffff:*) export NCCL_IB_GID_INDEX=$$i; break 2;; esac;; esac
            done
          done
        fi
        echo "[ds4v-miaai] NODE_RANK=$${NODE_RANK} MTP=$${MTP_NUM_TOKENS} GID=$${NCCL_IB_GID_INDEX}"

        API_KEY_ARGS=(); case "$${DSPARK_API_KEYS:-}" in *[$$'\r\n\v\f']*) echo "error: DSPARK_API_KEYS must be a single-line space-separated list" >&2; exit 2 ;; *\\*) echo "error: DSPARK_API_KEYS must not contain backslashes" >&2; exit 2 ;; esac; _dspark_keys_set=0; case "$${DSPARK_API_KEYS:-}" in *[!$$' \t']*) _dspark_keys_set=1 ;; esac; if [ -n "$${VLLM_API_KEY:-}" ] && [ "$${_dspark_keys_set}" = "1" ]; then echo "error: VLLM_API_KEY and DSPARK_API_KEYS are both set; set exactly one of them" >&2; exit 2; fi; if [ "$${_dspark_keys_set}" = "1" ]; then read -r -a _dspark_keys <<< "$${DSPARK_API_KEYS}"; for _dspark_key in "$${_dspark_keys[@]}"; do case "$${_dspark_key}" in -*) echo "error: DSPARK_API_KEYS contains a token beginning with '-'" >&2; exit 2 ;; esac; done; API_KEY_ARGS=(--api-key "$${_dspark_keys[@]}"); fi;

        if [ -z "$${NCCL_IB_MERGE_NICS:-}" ]; then unset NCCL_IB_MERGE_NICS; fi;
        if [ -z "$${NCCL_NET_GDR_LEVEL:-}" ]; then unset NCCL_NET_GDR_LEVEL; fi;
        if [ -z "$${NCCL_NET_GDR_READ:-}" ]; then unset NCCL_NET_GDR_READ; fi;
        if [ -z "$${NCCL_DMABUF_ENABLE:-}" ]; then unset NCCL_DMABUF_ENABLE; fi;
        if [ -n "$${TORCH_FR_DUMP_TEMP_FILE:-}" ]; then mkdir -p "$$(dirname "$${TORCH_FR_DUMP_TEMP_FILE}")" || echo "warn: cannot create flight-recorder dump dir; dumps will be lost (boot continues)" >&2; fi;

        # Encoder hotfix: copy the model snapshot's official encoding_dsv4.py
        # into the image, map reasoning_effort low/high/max, then apply the
        # issue #21 encoder fix. Skipped with a WARN if the snapshot lacks it.
        ENCODING_SOURCE="$${DSPARK_ENCODING_FILE:-}";
        if [ -z "$${ENCODING_SOURCE}" ]; then
          MODEL_HUB_DIR=$$(printf '%s' "$${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}" | sed 's|/|--|g');
          if [ -n "$${DSPARK_REVISION:-}" ] && [ -f "/cache/huggingface/hub/models--$${MODEL_HUB_DIR}/snapshots/$${DSPARK_REVISION}/encoding/encoding_dsv4.py" ]; then
            ENCODING_SOURCE="/cache/huggingface/hub/models--$${MODEL_HUB_DIR}/snapshots/$${DSPARK_REVISION}/encoding/encoding_dsv4.py";
          fi;
          if [ -z "$${ENCODING_SOURCE}" ]; then
            for candidate in /cache/huggingface/hub/models--$${MODEL_HUB_DIR}/snapshots/*/encoding/encoding_dsv4.py; do
              if [ -f "$${candidate}" ]; then ENCODING_SOURCE="$${candidate}"; break; fi;
            done;
          fi;
        fi;
        if [ -z "$${ENCODING_SOURCE}" ]; then for candidate in /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/*/encoding/encoding_dsv4.py; do if [ -f "$${candidate}" ]; then ENCODING_SOURCE="$${candidate}"; break; fi; done; fi;
        if [ -n "$${ENCODING_SOURCE}" ] && [ -f "$${ENCODING_SOURCE}" ]; then cp "$${ENCODING_SOURCE}" /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py || exit 1; python3 -c 'from pathlib import Path; p=Path("/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4.py"); s=p.read_text(); old="elif reasoning_effort in (\"max\", \"xhigh\"):\n                reasoning_effort = \"max\"\n            else:\n                reasoning_effort = \"high\""; new="elif reasoning_effort in (\"max\", \"xhigh\"):\n                reasoning_effort = \"max\"\n            elif reasoning_effort == \"high\":\n                reasoning_effort = \"high\"\n            else:\n                reasoning_effort = \"low\""; updated=s.replace(old,new); assert new in updated; p.write_text(updated)' || exit 1; python3 /opt/hotfix-encoding-dsv4-issue21.py || exit 1; else echo "WARN: encoding_dsv4.py not found (set DSPARK_ENCODING_FILE or check the model snapshot) - encoder copy, reasoning-effort mapping and issue21 skipped" >&2; fi; if [ "$${DSPARK_ENABLE_ISSUE31_GPU_HOTFIX:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-issue31-v2-thinking-budget-gpu.py || exit 1; fi; python3 /opt/hotfix-dsv4-issue55-tool-truncation.py || exit 1;

        # .sh hotfix chain (always-on unless explicitly skipped).
        if [ "$${DSPARK_SKIP_ISSUE22_HOTFIX:-0}" != "1" ]; then if [ ! -f /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh ]; then echo "FATAL: /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh missing" >&2; exit 1; fi; bash /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh || exit 1; fi;
        if [ "$${DSPARK_SKIP_SPIN_WAIT_HOTFIX:-0}" != "1" ]; then if [ ! -f /opt/dspark-patches/hotfix-gb10-spin-wait.sh ]; then echo "FATAL: /opt/dspark-patches/hotfix-gb10-spin-wait.sh missing" >&2; exit 1; fi; bash /opt/dspark-patches/hotfix-gb10-spin-wait.sh || exit 1; fi;
        if [ "$${DSPARK_SKIP_ISSUE117_RECHECK_HOTFIX:-0}" != "1" ]; then if [ ! -f /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py ]; then echo "FATAL: /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py missing" >&2; exit 1; fi; python3 /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py || exit 1; python3 /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py --status || exit 1; fi;
        if [ "$${DSPARK_SKIP_HOTFIX:-0}" != "1" ]; then for _hf in hotfix-dsv4-mtp-buffer-50312.sh hotfix-dsv4-skip-topk-49486.sh hotfix-dsv4-dense-prefill-indexer-48407.sh hotfix-dsv4-skip-empty-c128-48957.sh hotfix-dsv4-flashmla-workspace-50298.sh hotfix-dsv4-grammar-advance.sh; do if [ ! -f /opt/dspark-patches/$${_hf} ]; then echo "FATAL: /opt/dspark-patches/$${_hf} missing" >&2; exit 1; fi; bash /opt/dspark-patches/$${_hf} || exit 1; done; fi;
        if [ "$${_dspark_keys_set}" = "1" ] || [ -n "$${VLLM_API_KEY:-}" ]; then bash /opt/dspark-patches/hotfix-vllm-redact-api-key-log.sh || exit 1; bash /opt/dspark-patches/hotfix-vllm-redact-api-key-log.sh --status || exit 1; fi;

        # .py hotfix chain (always-on unless opt-in/opt-out).
        if [ "$${DSPARK_ENABLE_ISSUE138_RESPONSES_HISTORY_COMPAT:-0}" = "1" ]; then python3 /opt/hotfix-vllm-issue138-responses-history.py || exit 1; fi;
        python3 /opt/hotfix-dsv4-vision-exp.py || exit 1; if [ "$${DSPARK_ENABLE_ISSUE141_SPARSE_MLA_CHUNK:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-issue141-sparse-mla-decode-chunk.py || exit 1; fi; python3 /opt/hotfix-vllm-empty-encoder-output.py || exit 1; python3 /opt/hotfix-dsv4-issue27-partial-prefill-concurrency.py || exit 1; python3 /opt/hotfix-dsv4-issue43-decode-fairness-and-diag.py || exit 1; python3 /opt/hotfix-dsv4-issue26-hybrid-swa-min.py || exit 1; python3 /opt/hotfix-dsv4-issue133-triton-specialization.py || exit 1; if [ "$${DSPARK_SKIP_SUPPRESS_STOPS_HOTFIX:-0}" != "1" ]; then python3 /opt/hotfix-dsv4-suppress-stops-in-reasoning.py || exit 1; fi; VLLM_QUANTIZATION_ARGS="";
        if [ "$${DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-assistant-final-continuation.py || exit 1; fi;
        if [ "$${DSPARK_ENABLE_ISSUE136_XGRAMMAR_HOTFIX:-0}" = "1" ]; then python3 /opt/hotfix-vllm-issue136-xgrammar-termination.py || exit 1; fi;

        # Optional GB10 hybrid NVFP4 plugin (opt-in).
        if [ "$${ENABLE_VLLM_GB10_PATCH:-0}" = "1" ]; then
          python3 -m pip install -e /opt/vllm-gb10-hybrid-nvfp4 --no-deps;
          export VLLM_PLUGINS="$${VLLM_PLUGINS:-gb10_hybrid_nvfp4}";
          VLLM_QUANTIZATION_ARGS="--quantization modelopt_gb10_hybrid";
        fi;

        case "$${DRAFT_SAMPLE_METHOD:-probabilistic}" in
          probabilistic|greedy) DRAFT_SAMPLE_METHOD="$${DRAFT_SAMPLE_METHOD:-probabilistic}" ;;
          *) echo "DRAFT_SAMPLE_METHOD must be one of: probabilistic, greedy (got: $${DRAFT_SAMPLE_METHOD})" >&2; exit 2 ;;
        esac;
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS:-6},\"draft_sample_method\":\"$${DRAFT_SAMPLE_METHOD}\"}";
        case "$${DEFAULT_THINKING:-low}" in
          off) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":false}' ;;
          low) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":true,"reasoning_effort":"low"}' ;;
          high) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":true,"reasoning_effort":"high"}' ;;
          max) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":true,"reasoning_effort":"max"}' ;;
          *) echo "DEFAULT_THINKING must be one of: off, low, high, max (got: $${DEFAULT_THINKING})" >&2; exit 2 ;;
        esac;
        REVISION_ARGS="";
        if [ -n "$${DSPARK_REVISION:-}" ]; then REVISION_ARGS="--revision $${DSPARK_REVISION}"; fi;
        LIMIT_MM_RAW='${LIMIT_MM_PER_PROMPT:-image=8}'; case "$${LIMIT_MM_RAW}" in image=*) _lim_n="$${LIMIT_MM_RAW#image=}"; case "$${_lim_n}" in ''|*[!0-9]*) echo "error: LIMIT_MM_PER_PROMPT image=N needs an integer (Anemll --limit-mm-per-prompt requires JSON)" >&2; exit 2 ;; esac; LIMIT_MM_JSON="{\"image\":$${_lim_n}}" ;; *) LIMIT_MM_JSON="$${LIMIT_MM_RAW}" ;; esac; LIMIT_MM_ARGS=(--limit-mm-per-prompt "$${LIMIT_MM_JSON}");

        exec /usr/local/bin/vllm serve "$${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}" \
          $${REVISION_ARGS} \
          --served-model-name "$${SERVED_MODEL_NAME:-deepseek-v4-flash}" \
          --host "$${VLLM_HOST:-0.0.0.0}" --port "$${VLLM_PORT:-4000}" --trust-remote-code \
          "$${API_KEY_ARGS[@]}" $${VLLM_QUANTIZATION_ARGS} \
          --tensor-parallel-size 2 --pipeline-parallel-size 1 \
          --kv-cache-dtype nvfp4_ds_mla --block-size 256 \
          --max-model-len "$${MAX_MODEL_LEN:-1048576}" --max-num-seqs "$${MAX_NUM_SEQS:-6}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS:-8192}" \
          --long-prefill-token-threshold "$${LONG_PREFILL_TOKEN_THRESHOLD:-1024}" \
          --max-cudagraph-capture-size $$(( $${MAX_NUM_SEQS:-6} * ($${MTP_NUM_TOKENS:-6} + 1) )) \
          --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION:-0.83}" \
          --enable-prefix-caching --enable-prompt-tokens-details \
          --async-scheduling --enable-chunked-prefill \
          --speculative-config "$${SPECULATIVE_CONFIG}" \
          --tokenizer-mode deepseek_v4 \
          "$${LIMIT_MM_ARGS[@]}" \
          --distributed-executor-backend mp --moe-backend flashinfer_b12x \
          --tool-call-parser deepseek_v4 --enable-auto-tool-choice \
          --reasoning-parser deepseek_v4 \
          --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":" thinking","reasoning_end_str":" response"}' \
          --default-chat-template-kwargs "$${DEFAULT_CHAT_TEMPLATE_KWARGS}" \
          --generation-config vllm \
          --enable-flashinfer-autotune \
          --nnodes 2 --node-rank "$${NODE_RANK}" --master-addr "$${MASTER_ADDR}" --master-port "$${MASTER_PORT:-25000}" \
          $${HEADLESS:+--headless}
