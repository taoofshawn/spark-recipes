services:
  ds4v:
    # From-scratch build: lucamotz/vllm @ 71165e052 (upstream main at the
    # flashinfer 0.6.18 bump + the DSV4 vision layer + streaming loader + DSpark
    # trained-block-width + follow-up vision/DSpark fixes) + community
    # nvfp4_ds_mla KV patch + nvfp4+MLA validator exemption. Build with
    # ./build/build-vllm-vision.sh on a spark (ARM64). See README.
    image: vllm-vision-dspark:71165e0528
    # The official vLLM base image sets ENTRYPOINT=["vllm","serve"], which
    # swallows the compose command as serve-args. Override to bash and run
    # the boot script (GID detect, env prep, exec vllm serve) from a mounted
    # file — compose tokenizes multiline command strings, so a list-form
    # command would nest and a string form gets word-split.
    entrypoint: ["/bin/bash", "/boot.sh"]
    container_name: ds4v-dspark
    network_mode: host
    ipc: host
    restart: unless-stopped
    shm_size: 64g
    init: true
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    volumes:
      # HF cache must hold the DeepSeek-V4-Flash-Vision-Exp snapshot on BOTH
      # nodes (pinned by MODEL_REVISION). Container path per official image.
      - ${HF_CACHE:-/home/sdrew/.cache/huggingface}:/root/.cache/huggingface
      # NODE-LOCAL JIT/compile caches — deliberately a SEPARATE mount from the
      # HF cache (upstream issue #27). Seven caches are written concurrently
      # by both ranks; if they land on a shared (NFS) HF cache the failures
      # are serial and misleading. Keep on local disk on every node.
      - ${JIT_CACHE_DIR:-/home/sdrew/.cache/vllm-vision}:/vllm-cache
      # Boot script (GID autodetect + vllm serve launch); executed by the
      # overridden entrypoint.
      - ./boot.sh:/boot.sh:ro
      # ---- DSV4 vision overlays (editable-tree paths: /workspace/...) ----
      # The image pip-installs vLLM EDITABLE, so the runtime resolves vllm.*
      # from /workspace/vllm, NOT site-packages. Mounting an overlay into
      # site-packages/vllm breaks the editable finder at import time
      # (ModuleNotFoundError: vllm.v1.attention). Mount over the source tree.
      # 1) Vision-capable encoder + reasoning-effort prompts + tool-argument
      #    hardening (merged from the DeepSeek-ai reference encoder + the
      #    aiden/tonyd2wild tool-arg repair functions).
      - ./encoding_dsv4.py:/workspace/vllm/tokenizers/deepseek_v4_encoding.py:ro
      # 2) Tokenizer wrapper: PR #54566 base (max_token_id for image sentinels)
      #    + corrected reasoning-effort aliases (low/high/max/off).
      - ./deepseek_v4_wrapper.py:/workspace/vllm/tokenizers/deepseek_v4.py:ro
      # 3) Open-PR stop-suppression backport: don't evaluate client stop
      #    strings inside the reasoning segment (silent content:null answers).
      - ./detokenizer.py:/workspace/vllm/v1/engine/detokenizer.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      # ---- RoCE networking (site-specific — match YOUR NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      VLLM_HOST_IP: "${ROCE_IP}"
      # ---- runtime (official vLLM image layout: /opt/venv) ----
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CACHE_ROOT: /vllm-cache
      DG_JIT_CACHE_DIR: /vllm-cache/deepgemm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TORCHINDUCTOR_CACHE_DIR: /vllm-cache/torchinductor-cache
      TRITON_CACHE_DIR: /vllm-cache/triton-cache
      TORCH_EXTENSIONS_DIR: /vllm-cache/torch_extensions
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_SKIP_INIT_MEMORY_CHECK: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      # flashinfer-python is pinned to 0.6.18 in the image (contains the DSV4
      # sparse MLA (q_heads=32, top_k=192) dispatch from PR #4380). The
      # companion flashinfer-cubin 0.6.18 was never published to PyPI, so the
      # cross-package version check must be bypassed; the sparse-MLA kernel is
      # JIT-compiled at first use (cached under /vllm-cache/flashinfer).
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      # VLLM_USE_B12X_MHC must stay OFF: Vision-Exp rms_norm_eps=1e-20 breaks
      # the fused Gram mHC kernel which only accepts 1e-6 (sfxnz + tonyd2wild).
      # The official B12X path selects flashinfer_b12x by default; keep the
      # vision backend on the FlashInfer sparse MLA the PRs were tested on.
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "off"
      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
      # ---- model / serve ----
      MODEL_PATH: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      # Served revision MUST match the snapshot cached offline on both nodes
      # (HF_HUB_OFFLINE=1). Both nodes cache HEAD e46e16bf… (weights identical
      # to the community pin 86f746b3… — later commits touch README/eval only,
      # see research.md §1). Point this at whichever snapshot is on disk.
      MODEL_REVISION: e46e16bf6035c6f317eb2ac7458eb0362926d402
      SERVED_MODEL_NAME: deepseek-v4-flash-vision-exp
      PORT: "${PORT:-4000}"
      GPU_MEM: 0.83
      # DSpark speculative depth. The Vision-Exp checkpoint has
      # num_nextn_predict_layers=3 and dspark_block_size=5; the upstream
      # DSpark config uses dspark_block_size as the trained draft width, so
      # k=6 (a multiple of 3) is what both working vision recipes (MiaAI,
      # sfxnz) boot with. Capture size = MAX_NUM_SEQS x (k+1).
      MTP_NUM_TOKENS: 5
      TP_SIZE: 2
      MAX_MODEL_LEN: 1048576
      # Vision-Exp ViT takes more weight RAM than 0731 (MiaAI measured);
      # 6 slots / 8192 batched tokens is the validated vision profile.
      MAX_NUM_SEQS: 6
      MAX_NUM_BATCHED_TOKENS: 8192
      # nvfp4_ds_mla (community patch) passes config validation and the
      # flashinfer (32,192) dispatch, but the DSpark draft FULL-graph capture
      # crashes at kernel launch with the NVFP4 KV layout
      # ("decode-dsv4 launch failed: unsupported shape or kernel error").
      # Fall back to fp8_ds_mla (upstream dtype, aiden-proven) per the
      # documented contingency in research.md; revisit nvfp4 when flashinfer
      # ships a build fixing the nvfp4+192 draft-shape launch.
      KV_CACHE_DTYPE: fp8_ds_mla
      THINKING: true
      REASONING_EFFORT: high
      ASYNC_SCHED: 1

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"
