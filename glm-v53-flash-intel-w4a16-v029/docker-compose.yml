services:
  vllm-dspark:
    image: ${IMAGE}
    # Clear the image's ENTRYPOINT (["vllm","serve"]) — the command block below
    # is the actual entry; without this the bash script is appended to
    # `vllm serve` as args and the container dies at argparse.
    entrypoint: []
    container_name: glm53-intel-w4a16-v029
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$HEADLESS\" ]; then exit 0; fi; curl -fsS http://127.0.0.1:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    volumes:
      # Model weights: the RAW Intel W4A16 AutoRound snapshot at MODEL_REVISION
      # is served directly — v0.29.0's INCConfig loads quant_method "auto-round"
      # natively, so there is NO gptq-surgery revision and NO prepare-model.sh
      # step. DFlash drafter resolution is not needed (mtp3 lane only).
      - ${HF_CACHE}:/cache/huggingface
      # Cache root -> /cache (JIT caches; node-local disk only) + a /root/.cache
      # catch-all for anything that ignores the env overrides below.
      - ${CACHE_HOST_PATH}:/cache
      - ${CACHE_HOST_PATH}/root-cache:/root/.cache
      # NO vLLM file overlays: the SM121 patch stack (#53388 backport, LCM
      # align, PR #53969 NoPE/topk, PDL gate) and the chat template are baked
      # into the image at build time (see image/Dockerfile).
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # ---- node identity (rank / headless) ----
      NODE_RANK: "${NODE_RANK:-0}"
      HEADLESS: "${HEADLESS:-}"
      ROCE_IP: "${ROCE_IP:-}"
      # Multi-node rendezvous + serve port (read by the command block)
      MASTER_ADDR: "${MASTER_ADDR}"
      PORT: "${PORT:-8000}"
      MPORT: "${MPORT:-29521}"
      # ---- serving profile (command block reads these shell-side) ----
      GMU: "${GMU:-0.85}"
      MAX_LEN: "${MAX_LEN:-1048576}"
      MAX_SEQS: "${MAX_SEQS:-6}"
      MNBT: "${MNBT:-8192}"
      BLOCK_SIZE: "${BLOCK_SIZE:-2304}"
      KV_DTYPE: "${KV_DTYPE:-fp8_e4m3}"
      KV_CACHE_MEMORY: "${KV_CACHE_MEMORY:-}"
      ASYNC: "${ASYNC:-0}"
      LANE: "${LANE:-mtp3}"
      PMU: "${PMU:-1}"
      DISABLE_FLASHINFER_AUTOTUNE: "${DISABLE_FLASHINFER_AUTOTUNE:-1}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-glm-5.3-flash}"
      # Model identity — the RAW snapshot revision (no surgery). Serving the
      # HF ID keeps /v1/models .root == the HF id (tool-eval-bench parity).
      MODEL: "${MODEL}"
      MODEL_REVISION: "${MODEL_REVISION}"
      # ---- sampling / thinking defaults (explicit, legacy-lane parity) ----
      THINKING: "${THINKING:-true}"
      REASONING_EFFORT: "${REASONING_EFFORT:-high}"
      TEMPERATURE: "${TEMPERATURE:-1.0}"
      TOP_P: "${TOP_P:-0.95}"
      # ---- RoCE networking (this cluster's NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_NET_PLUGIN: none
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ADDR_RANGE: "${NCCL_SUBNET}"
      NCCL_SOCKET_IFNAME: "${ETH_IF}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      MN_IF_NAME: "${ETH_IF}"
      NCCL_NVLS_ENABLE: "0"
      NCCL_CROSS_NIC: "0"
      NCCL_IB_MERGE_NICS: "0"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      NCCL_MIN_NCHANNELS: "${NCCL_NCHANNELS:-8}"
      NCCL_MAX_NCHANNELS: "${NCCL_NCHANNELS:-8}"
      # ---- runtime (stock v0.29.0; vLLM at /usr/local/lib/python3.12/dist-packages) ----
      VLLM_HOST_IP: "${ROCE_IP}"
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_S: "3600"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      TORCHINDUCTOR_CACHE_DIR: "/cache/torchinductor"
      TILELANG_CACHE_DIR: "/cache/tilelang"
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        # ---- GID auto-detect (sysfs; GID table renumbers across reboots and a
        # wrong index dies ~60 s later in NCCL QP setup) ----
        if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
          _want="$$(printf '0000:0000:0000:0000:0000:ffff:%02x%02x:%02x%02x' $$(echo "$${ROCE_IP}" | tr . ' '))"
          for _g in /sys/class/infiniband/rocep1s0f0/ports/1/gids/*; do
            [ "$$(cat "$$_g" 2>/dev/null)" = "$$_want" ] || continue
            _idx="$${_g##*/}"
            [[ "$$(cat "/sys/class/infiniband/rocep1s0f0/ports/1/gid_attrs/types/$$_idx" 2>/dev/null)" == *"v2"* ]] || continue
            NCCL_IB_GID_INDEX="$$_idx"; break
          done
          if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
            echo "error: no RoCE v2 GID matching $$ROCE_IP on rocep1s0f0; table:" >&2
            for _g in /sys/class/infiniband/rocep1s0f0/ports/1/gids/*; do
              _idx="$${_g##*/}"
              echo "  gid $$_idx: $$(cat "$$_g" 2>/dev/null) type=$$(cat "/sys/class/infiniband/rocep1s0f0/ports/1/gid_attrs/types/$$_idx" 2>/dev/null)" >&2
            done
            echo "override with NCCL_IB_GID_INDEX=<idx> if the table disagrees" >&2
            exit 2
          fi
          echo "GID auto-detect: NCCL_IB_GID_INDEX=$${NCCL_IB_GID_INDEX}"
          export NCCL_IB_GID_INDEX
        fi

        # ---- preflight: the RAW model snapshot must exist and be auto-round
        # (NO surgery revision on this lane — v0.29.0 loads auto-round natively
        # via INCConfig; a gptq-surgery revision is neither written nor used) ----
        HUB=/cache/huggingface/hub/models--$$(printf '%s' "$${MODEL}" | sed 's|/|--|g')
        M="$$HUB/snapshots/$${MODEL_REVISION}"
        [ -f "$$M/config.json" ] || { echo "FATAL: raw snapshot missing at $$M — download Intel/GLM-5.3-Flash-W4A16-AutoRound --revision $$MODEL_REVISION on this node (see README)" >&2; exit 2; }
        python3 - "$$M/config.json" <<'PY' || { echo "FATAL: raw snapshot config is not auto-round (unexpected — this recipe serves the raw Intel checkpoint)" >&2; exit 2; }
        import json, sys
        qc = json.load(open(sys.argv[1])).get("quantization_config") or {}
        sys.exit(0 if qc.get("quant_method") == "auto-round" else 3)
        PY
        echo "[glm53-intel-w4a16-v029] raw auto-round snapshot OK: $$M"

        ARGS=(serve "$$MODEL" --revision "$${MODEL_REVISION}"
          --served-model-name "$${SERVED_MODEL_NAME:-glm-5.3-flash}"
          --host 0.0.0.0 --port "$${PORT:-8000}"
          --trust-remote-code
          --tensor-parallel-size 2
          --gpu-memory-utilization "$${GMU:-0.85}"
          --max-model-len "$${MAX_LEN:-1048576}"
          --max-num-seqs "$${MAX_SEQS:-6}"
          --block-size "$${BLOCK_SIZE:-2304}"
          --kv-cache-dtype "$${KV_DTYPE:-fp8_e4m3}"
        )
        # Speculative: native MTP k=3 with disable_eagle_block_drop=true (the
        # flag exists via baked patch 0001 = PR #53388 backport) + PMU128
        # prefix matching + prompt-token details. This image is mtp3-only; the
        # dflash2pmu lane stays on the legacy glm-v53-flash-intel-w4a16 image.
        ARGS+=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":3,\"disable_eagle_block_drop\":true}")
        [ "$${PMU:-0}" != "0" ] && ARGS+=(--prefix-match-unit 128 --enable-prompt-tokens-details)
        [ -n "$${MNBT:-}" ] && ARGS+=(--max-num-batched-tokens "$${MNBT}")
        _kvmem="$${KV_CACHE_MEMORY:-}"
        # v0.29.0 renamed the flag: --kv-cache-memory -> --kv-cache-memory-bytes
        [ -n "$$_kvmem" ] && ARGS+=(--kv-cache-memory-bytes "$$_kvmem")
        ARGS+=(--moe-backend "$${MOE_BACKEND:-marlin}")
        # Parsers + explicit thinking defaults. The baked chat template
        # (/models/chat_template_mm.jinja) honors enable_thinking +
        # reasoning_effort; the kwargs pin them server-side (clients override
        # per request via chat_template_kwargs / the OpenAI reasoning_effort
        # field).
        ARGS+=(--tool-call-parser glm47 --enable-auto-tool-choice
          --reasoning-parser glm45
          --chat-template /models/chat_template_mm.jinja
          --default-chat-template-kwargs "{\"enable_thinking\": $${THINKING:-true}, \"reasoning_effort\": \"$${REASONING_EFFORT:-high}\"}")
        # Sampling pins — explicit recipe-owned (temp 1.0 / top_p 0.95, same
        # values as the other recipes). --generation-config vllm ignores the
        # checkpoint's generation_config.json for SAMPLING only (multi-EOS
        # stop set still loads from it).
        GEN_CFG="{\"temperature\": $${TEMPERATURE:-1.0}, \"top_p\": $${TOP_P:-0.95}}"
        ARGS+=(--generation-config vllm --override-generation-config "$${GEN_CFG}")
        # Eager / autotune / async
        [ "$${EAGER:-0}" != "0" ] && ARGS+=(--enforce-eager)
        [ "$${DISABLE_FLASHINFER_AUTOTUNE:-1}" != "0" ] && ARGS+=(--no-enable-flashinfer-autotune)
        [ "$${ASYNC:-0}" != "0" ] && ARGS+=(--async-scheduling)
        # Multi-node TP=2
        ARGS+=(--distributed-executor-backend mp
          --nnodes 2 --node-rank "$${NODE_RANK:-0}"
          --master-addr "$${MASTER_ADDR}" --master-port "$${MPORT:-29521}")
        [ -n "$${HEADLESS:-}" ] && ARGS+=(--headless)

        echo "launched image=$IMAGE rank=$${NODE_RANK:-0} host=$${ROCE_IP} gid=$${NCCL_IB_GID_INDEX} lane=$${LANE:-mtp3} kv=$${_kvmem:-profiler}/$${KV_DTYPE} max_len=$${MAX_LEN:-1048576} seqs=$${MAX_SEQS:-6} moe=$${MOE_BACKEND:-marlin} rev=$${MODEL_REVISION}"

        exec vllm "$${ARGS[@]}"
