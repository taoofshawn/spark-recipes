services:
  vllm-dspark:
    image: ${IMAGE}
    # Clear the image's ENTRYPOINT (["vllm","serve"]) — the command block below
    # is the actual entry; without this the bash script is appended to
    # `vllm serve` as args and the container dies at argparse (parity with
    # glm-v53-flash / glm-v53-flash-miaai, which also set entrypoint: []).
    entrypoint: []
    container_name: glm53-intel-w4a16
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$HEADLESS\" ]; then exit 0; fi; curl -fsS http://127.0.0.1:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    volumes:
      # Post-surgery weights (prepare-model.sh: hardlinks from the HF snapshot +
      # rewritten config.json). DFlash2 drafter is resolved from HF_CACHE at
      # boot — no separate volume mount needed.
      - ${MODEL_HOST_PATH}:/models/intel-gptq-surgery:ro
      # HF hub cache (Intel snapshot + DFlash2 drafter; downloaded on both nodes)
      - ${HF_CACHE}:/cache/huggingface
      # Cache root -> /cache (JIT caches; node-local disk only) + a /root/.cache
      # catch-all for anything that ignores the env overrides below.
      - ${CACHE_HOST_PATH}:/cache
      - ${CACHE_HOST_PATH}/root-cache:/root/.cache
      # SM121 indexer overlay (full-file replacement; fail-closed at boot if the
      # injected file does not exist — the mount is per-file so a missing host
      # file makes the mount fail loudly, which is what we want).
      - ./patches/sparse_attn_indexer_kpool.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/sparse_attn_indexer_kpool.py:ro
      # Hybrid prefix-cache (APC) patch script — applied at boot before vllm
      # serve (idempotent + fail-closed: anchors drift -> boot aborts).
      - ./patches/patch_hybrid_prefix_hit.py:/patches/patch_hybrid_prefix_hit.py:ro
      # Fixed chat template (enable_thinking + reasoning_effort + image/video
      # macros; rodman80's copy, validated on this image). The Intel repo ships
      # a complete template but it ignores enable_thinking — this file makes
      # the THINKING toggle explicit (parity with glm-v53-flash-entrpi).
      - ./patches/chat_template_mm.jinja:/models/chat_template_mm.jinja:ro
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # ---- node identity (rank / headless) ----
      NODE_RANK: "${NODE_RANK:-0}"
      HEADLESS: "${HEADLESS:-}"
      ROCE_IP: "${ROCE_IP:-}"
      # Multi-node rendezvous + serve port (read by the command block)
      MASTER_ADDR: "${MASTER_ADDR}"
      PORT: "${PORT:-8000}"
      MPORT: "${MPORT:-29521}"
      # ---- serving profile (command block reads these shell-side) ----
      GMU: "${GMU:-0.85}"
      MAX_LEN: "${MAX_LEN:-1048576}"
      MAX_SEQS: "${MAX_SEQS:-8}"
      MNBT: "${MNBT:-8192}"
      BLOCK_SIZE: "${BLOCK_SIZE:-2304}"
      KV_DTYPE: "${KV_DTYPE:-fp8_e4m3}"
      KV_CACHE_MEMORY: "${KV_CACHE_MEMORY:-}"
      # Drafter lane: "dflash2" (default, miken's validated row) or "mtp3"
      # (vendored florianbrede lane — see mtp3-pmu128/README.md). mtp3 requires
      # an image built from mtp3-pmu128/Dockerfile (patches baked at build).
      LANE: "${LANE:-dflash2}"
      # DFlash2 drafter (dflash2 lane; resolved from the HF cache snapshot at boot)
      DFLASH_MODEL: "${DFLASH_MODEL:-incoai/GLM-5.3-Flash-DFlash2}"
      DFLASH_REVISION: "${DFLASH_REVISION:-dc77ff1c99eeb2df044ee3d4f0094eb033fee410}"
      DFLASH_TOKENS: "${DFLASH_TOKENS:-7}"
      # PMU128 prefix matching (mtp3 lane; needs the mtp3-pmu128 image)
      PMU: "${PMU:-0}"
      DISABLE_FLASHINFER_AUTOTUNE: "${DISABLE_FLASHINFER_AUTOTUNE:-1}"
      VLLM_MARLIN_USE_ATOMIC_ADD: "${VLLM_MARLIN_USE_ATOMIC_ADD:-0}"
      VLLM_USE_FUSED_MOE_GROUPED_TOPK: "${VLLM_USE_FUSED_MOE_GROUPED_TOPK:-0}"
      GLM53_INDEXER_WORKSPACE: "${GLM53_INDEXER_WORKSPACE:-rightsize}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-glm-5.3-flash}"
      # ---- sampling / thinking defaults (explicit, repo parity: thinking ON
      # at REASONING_EFFORT; temp 1.0 / top_p 0.95) ----
      THINKING: "${THINKING:-true}"
      REASONING_EFFORT: "${REASONING_EFFORT:-high}"
      TEMPERATURE: "${TEMPERATURE:-1.0}"
      TOP_P: "${TOP_P:-0.95}"
      GEN_CFG: "${GEN_CFG:-}"
      # ---- RoCE networking (this cluster's NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_NET_PLUGIN: none
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ADDR_RANGE: "${NCCL_SUBNET}"
      NCCL_SOCKET_IFNAME: "${ETH_IF}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      MN_IF_NAME: "${ETH_IF}"
      NCCL_NVLS_ENABLE: "0"
      NCCL_CROSS_NIC: "0"
      NCCL_IB_MERGE_NICS: "0"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      NCCL_MIN_NCHANNELS: "${NCCL_NCHANNELS:-8}"
      NCCL_MAX_NCHANNELS: "${NCCL_NCHANNELS:-8}"
      # ---- runtime (Tony sm121-v11 lineage; vLLM at /usr/local/lib/python3.12) ----
      VLLM_HOST_IP: "${ROCE_IP}"
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_S: "3600"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      TORCHINDUCTOR_CACHE_DIR: "/cache/torchinductor"
      TILELANG_CACHE_DIR: "/cache/tilelang"
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        # ---- GID auto-detect (sysfs; GID table renumbers across reboots and a
        # wrong index dies ~60 s later in NCCL QP setup) ----
        if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
          _want="$$(printf '0000:0000:0000:0000:0000:ffff:%02x%02x:%02x%02x' $$(echo "$${ROCE_IP}" | tr . ' '))"
          for _g in /sys/class/infiniband/rocep1s0f0/ports/1/gids/*; do
            [ "$$(cat "$$_g" 2>/dev/null)" = "$$_want" ] || continue
            _idx="$${_g##*/}"
            [[ "$$(cat "/sys/class/infiniband/rocep1s0f0/ports/1/gid_attrs/types/$$_idx" 2>/dev/null)" == *"v2"* ]] || continue
            NCCL_IB_GID_INDEX="$$_idx"; break
          done
          if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
            echo "error: no RoCE v2 GID matching $$ROCE_IP on rocep1s0f0; table:" >&2
            for _g in /sys/class/infiniband/rocep1s0f0/ports/1/gids/*; do
              _idx="$${_g##*/}"
              echo "  gid $$_idx: $$(cat "$$_g" 2>/dev/null) type=$$(cat "/sys/class/infiniband/rocep1s0f0/ports/1/gid_attrs/types/$$_idx" 2>/dev/null)" >&2
            done
            echo "override with NCCL_IB_GID_INDEX=<idx> if the table disagrees" >&2
            exit 2
          fi
          echo "GID auto-detect: NCCL_IB_GID_INDEX=$${NCCL_IB_GID_INDEX}"
          export NCCL_IB_GID_INDEX
        fi

        # ---- preflight: post-surgery model dir (prepare-model.sh) ----
        M=/models/intel-gptq-surgery
        [ -f "$$M/config.json" ] || { echo "FATAL: $$M/config.json missing — run prepare-model.sh on this node (see README)" >&2; exit 2; }
        grep -q '"quant_method": "gptq"' "$$M/config.json" || { echo "FATAL: $$M/config.json is not the GPTQ-surgery config (run prepare-model.sh)" >&2; exit 2; }
        # ---- APC patch: hybrid prefix-cache hits (fail-closed) ----
        # (dflash2 lane only — the mtp3-pmu128 image bakes the #53388/#53906
        # coordinator patches instead; the anchors here would not match.)
        if [ "$${LANE:-dflash2}" = "dflash2" ]; then
          python3 /patches/patch_hybrid_prefix_hit.py
        fi

        # ---- dflash2 lane: resolve the DFlash2 drafter to its HF snapshot dir
        # (offline). mtp3 lane needs no drafter checkpoint. ----
        DFLASH_MODEL_DIR=""
        if [ "$${LANE:-dflash2}" = "dflash2" ]; then
          resolve_snapshot() {
            local hub="$1" rev="$2"
            local dir="/cache/huggingface/hub/models--$$(echo "$$hub" | sed 's|/|--|g')"
            if [ -n "$$rev" ] && [ -d "$$dir/snapshots/$$rev" ]; then echo "$$dir/snapshots/$$rev"; return 0; fi
            local snap; for snap in "$$dir"/snapshots/*/; do
              if [ -f "$$snap/config.json" ]; then echo "$$snap"; return 0; fi
            done
            echo ""
          }
          DFLASH_MODEL_DIR="$$(resolve_snapshot "$${DFLASH_MODEL}" "$${DFLASH_REVISION:-}")"
          [ -n "$$DFLASH_MODEL_DIR" ] || { echo "FATAL: DFlash2 drafter not found in HF cache for $$DFLASH_MODEL. Download on both nodes first (see README)." >&2; exit 2; }
          echo "[glm53-intel-w4a16] drafter=$$DFLASH_MODEL_DIR"
        fi
        ARGS=(serve "$$M"
          --served-model-name "$${SERVED_MODEL_NAME:-glm-5.3-flash}"
          --host 0.0.0.0 --port "$${PORT:-8000}"
          --trust-remote-code
          --tensor-parallel-size 2
          --gpu-memory-utilization "$${GMU:-0.85}"
          --max-model-len "$${MAX_LEN:-1048576}"
          --max-num-seqs "$${MAX_SEQS:-8}"
          --block-size "$${BLOCK_SIZE:-2304}"
          --kv-cache-dtype "$${KV_DTYPE:-fp8_e4m3}"
        )
        # Speculative: lane-conditional. dflash2 = DFlash2 k=7 (fixed — any
        # other count wedges the boot). mtp3 = native MTP k=3 with
        # disable_eagle_block_drop=true (upstream PR #53388, baked into the
        # mtp3-pmu128 image) + PMU128 prefix matching + prompt-token details
        # (florianbrede's validated profile, forum 382632 / mtp3-pmu128/README).
        if [ "$${LANE:-dflash2}" = "mtp3" ]; then
          ARGS+=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":3,\"disable_eagle_block_drop\":true}")
          [ "$${PMU:-0}" != "0" ] && ARGS+=(--prefix-match-unit 128 --enable-prompt-tokens-details)
        else
          ARGS+=(--speculative-config "{\"method\":\"dflash\",\"model\":\"$$DFLASH_MODEL_DIR\",\"num_speculative_tokens\":$${DFLASH_TOKENS:-7}}")
        fi
        [ -n "$${MNBT:-}" ] && ARGS+=(--max-num-batched-tokens "$${MNBT}")
        _kvmem="$${KV_CACHE_MEMORY:-}"
        [ -n "$$_kvmem" ] && ARGS+=(--kv-cache-memory "$$_kvmem")
        ARGS+=(--moe-backend "$${MOE_BACKEND:-marlin}")
        # Parsers (glm-glue) + explicit thinking defaults. The vendored
        # chat_template_mm.jinja (mounted at /models/chat_template_mm.jinja)
        # honors enable_thinking + reasoning_effort; without the kwargs the
        # template defaults to effort=max/thinking-on, so we pin them
        # server-side (clients override per request via chat_template_kwargs /
        # the OpenAI reasoning_effort field).
        ARGS+=(--tool-call-parser glm47 --enable-auto-tool-choice
          --reasoning-parser glm45
          --chat-template /models/chat_template_mm.jinja
          --default-chat-template-kwargs "{\"enable_thinking\": $${THINKING:-true}, \"reasoning_effort\": \"$${REASONING_EFFORT:-high}\"}")
        # Sampling pins — explicit recipe-owned (temp 1.0 / top_p 0.95, same
        # values as the other recipes). --generation-config vllm ignores the
        # checkpoint's generation_config.json for SAMPLING only (multi-EOS
        # stop set still loads from it), so a checkpoint refresh can't drift
        # top_p back to vLLM's 1.0.
        GEN_CFG="{\"temperature\": $${TEMPERATURE:-1.0}, \"top_p\": $${TOP_P:-0.95}}"
        ARGS+=(--generation-config vllm --override-generation-config "$${GEN_CFG}")
        # Eager / autotune / async
        [ "$${EAGER:-0}" != "0" ] && ARGS+=(--enforce-eager)
        [ "$${DISABLE_FLASHINFER_AUTOTUNE:-1}" != "0" ] && ARGS+=(--no-enable-flashinfer-autotune)
        [ "$${ASYNC:-0}" != "0" ] && ARGS+=(--async-scheduling)
        # Multi-node TP=2
        ARGS+=(--distributed-executor-backend mp
          --nnodes 2 --node-rank "$${NODE_RANK:-0}"
          --master-addr "$${MASTER_ADDR}" --master-port "$${MPORT:-29521}")
        [ -n "$${HEADLESS:-}" ] && ARGS+=(--headless)

        echo "launched image=$IMAGE rank=$${NODE_RANK:-0} host=$${ROCE_IP} gid=$${NCCL_IB_GID_INDEX} lane=$${LANE:-dflash2} kv=$${_kvmem:-profiler}/$${KV_DTYPE} max_len=$${MAX_LEN:-1048576} seqs=$${MAX_SEQS:-8} moe=$${MOE_BACKEND:-marlin}"

        exec vllm "$${ARGS[@]}"
