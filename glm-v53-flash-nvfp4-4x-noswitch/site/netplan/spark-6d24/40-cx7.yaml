# PHASE E (2026-10) four-PF fabric netplan for rank 3 (spark-6d24) — install as
# /etc/netplan/40-cx7.yaml, then 'sudo netplan try' (120 s auto-rollback) or 'apply'.
#
# Extends the FP8 recipe's 2-PF netplan (glm-v53-flash-4x-noswitch/upstream/scripts/
# node/etc/spark-6d24/40-cx7.yaml) ADDITIVELY: each cable's /24 gains one address per node
# on the second PCIe view (enP2p1s0f*), last octet = the f-port octet + 2. Every 200G
# cable therefore carries both PCIe roots on the same cable subnet, which is the
# four-PF NCCL listener contract (2 cable subnets x 2 PCI roots, full cross product —
# tp4ValidateListener in site/nccl-4pf/nccl-2.30.7-dual-pf.site.patch).
# The f-port addresses are UNCHANGED from the FP8 plan, so the FP8 lane's 2-PF transport
# keeps working against this netplan. DO NOT re-deploy the FP8 recipe's 2-address
# netplan after Phase E — it strips the P2 addresses and breaks this lane.
# This rank sits on L3 (towards rank 2) and L4 (towards rank 0).
network:
  version: 2
  renderer: NetworkManager
  ethernets:
    enp1s0f0np0:
      dhcp4: false
      dhcp6: false
      mtu: 9000
      optional: true
      addresses:
        - 10.10.3.4/24
    enP2p1s0f0np0:
      dhcp4: false
      dhcp6: false
      mtu: 9000
      optional: true
      addresses:
        - 10.10.3.6/24
    enp1s0f1np1:
      dhcp4: false
      dhcp6: false
      mtu: 9000
      optional: true
      addresses:
        - 10.10.4.4/24
    enP2p1s0f1np1:
      dhcp4: false
      dhcp6: false
      mtu: 9000
      optional: true
      addresses:
        - 10.10.4.6/24
