services:
  glm53:
    build:
      context: ./patches
      dockerfile: Dockerfile
    image: glm53-nvfp4-sm121:local
    container_name: glm53-nvfp4
    network_mode: host
    ipc: host
    restart: unless-stopped
    shm_size: 32g
    init: true
    ulimits:
      memlock: -1
      stack: 67108864
    # The day-0 vLLM image ships ENTRYPOINT=["vllm","serve"]; clear it so the
    # command block below (GID detect + model resolve + cache flusher + serve)
    # is what actually runs.
    entrypoint: []
    volumes:
      # Model weights — served OFFLINE from the HF cache on both nodes
      # (~195 GB LibertAIDAI/GLM-5.3-Flash-NVFP4 snapshot). Local weights on
      # BOTH ranks is required for the 672K-token KV pool (see .env notes).
      - ${HF_CACHE:-/home/sdrew/.cache/huggingface}:/cache/huggingface
      # NODE-LOCAL JIT/compile caches — MUST stay on local disk, never a
      # shared/NFS mount (same rule as the DeepSeek recipes' /vllm-cache).
      - ${JIT_CACHE_DIR:-/home/sdrew/.cache/vllm-glm53}:/glm-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      # ---- RoCE networking (site-specific — match YOUR NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_RANGE: "${NCCL_IB_ADDR_RANGE:-}"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_NVLS_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      VLLM_HOST_IP: "${ROCE_IP}"
      # ---- HF / offline ----
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      # ---- JIT caches (node-local /glm-cache volume above) ----
      VLLM_CACHE_ROOT: /glm-cache
      TRITON_CACHE_DIR: /glm-cache/triton
      TORCHINDUCTOR_CACHE_DIR: /glm-cache/torchinductor
      FLASHINFER_CACHE_DIR: /glm-cache/flashinfer
      # Engine-ready timeout (GLM loads ~195 GB across two nodes; stock 600 s
      # can trip on a warm restart — same fix as the DeepSeek recipes).
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      # GB10: unified DRAM, no framebuffer — allocations go through NVRM.
      # expandable_segments is the validated config for this vLLM stack
      # (tonyd2wild GLM + this repo's DSv4 tonyd2wild recipe both use it).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # ---- model / serve ----
      MODEL_ID: LibertAIDAI/GLM-5.3-Flash-NVFP4
      MODEL_REVISION: aa28e1f54130286c95fee10d0705c74ce8743734
      SERVED_MODEL_NAME: glm-5.3-flash
      PORT: "${PORT:-4000}"
      TP_SIZE: "2"
      # 262144 is the validated TP2 ceiling. The model-native 1M context
      # requires TP4 (4 nodes) — do NOT raise this on 2 nodes.
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-262144}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-6}"
      # MUST stay >= 2048 (the DSA indexer's index_topk) — below it GLM-5.3
      # segfaults in warmup (tonyd2wild KV-hunt trap).
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-8192}"
      # 2304 = multiple of kpool*64 (DeepGEMM arch-12 fp8 paged-MQA page size)
      # and of the MLA 128 alignment. Do NOT change casually.
      BLOCK_SIZE: "${BLOCK_SIZE:-2304}"
      # The quant card's known-good sm_121 MoE backend — FLASHINFER_CUTLASS
      # can produce silent garbage loops on SM121 (GLM-5.3 day-0 lesson).
      MOE_BACKEND: "${MOE_BACKEND:-marlin}"
      GPU_MEM: "${GPU_MEM:-0.85}"
      # 0.78/0.80 starve the bf16 KV cache at 131K+; 0.85 is the validated value.
      # fp8 KV on the patched NoPE-MLA path (first on consumer Blackwell).
      KV_CACHE_DTYPE: "${KV_CACHE_DTYPE:-fp8_e4m3}"
      # Pin the KV slab explicitly (vLLM's suggested number is the ONLY safe
      # one on GB10 — see RESEARCH.md "GB10 KV memory wall"). Default 4445787956
      # = 4.14 GiB/rank = 507,041 fp8 tokens, "works every time" (3/3) even
      # with an NFS-shared rank. Upgrade to 5905580032 (5.5 GiB / 672,606)
      # ONLY with local weights on both ranks + the cache-flush ritual
      # (tonyd2wild's stress-verified record); above ~6 GiB/rank reservations
      # "succeed" then die on first touch (phantom backing).
      KV_CACHE_MEMORY: "${KV_CACHE_MEMORY:-4445787956}"
      # MTP spec-decode (the in-checkpoint BF16 draft head). 3 = measured TP2
      # winner (chishiki37: 28.3 tok/s, +30% vs MTP4; per-position acceptance
      # [0.83,0.59,0.34,0.18] means draft pos 4+ mostly pays verify cost).
      # tonyd2wild ships 4; MTP5 can gibberish (forum 353069).
      SPEC_TOKENS: "${SPEC_TOKENS:-3}"
      # --language-model-only skips the multimodal processor (~15.7 GB of API
      # front-end memory) for a text-only endpoint. Keep vision by default.
      LANGUAGE_MODEL_ONLY: "${LANGUAGE_MODEL_ONLY:-0}"
      # DFlash2 block-diffusion drafter (OPT-IN; 2.15x single-stream vs MTP
      # upstream, 56.2 tok/s agg @ C5). Requires the drafter checkpoint on
      # BOTH nodes (2.34 GB):
      #   hf download incoai/GLM-5.3-Flash-DFlash2 --revision 7d74cdd881ed7e32c31175984a67823127b66cfe
      # LICENSE: CC-BY-NC-ND-4.0 — NON-COMMERCIAL use only (the base model is
      # MIT; the drafter is not). When enabled, the KV pin defaults to
      # 3221225472 (3 GiB) for concurrency headroom unless KV_CACHE_MEMORY is
      # set explicitly, and SPEC_TOKENS must be 7 (drafter block 8 - 1).
      # With DFLASH2=1 the KV pin drops to 3221225472 (3 GiB — upstream's
      # shipped DFlash2 launcher value) for concurrency headroom. Do NOT
      # chase ceiling pins: upstream withdrew its 7 GiB figure (2026-08-28
      # correction) — pinned pools skip the activation-headroom subtraction
      # and die on the first long prompt. Profiler-sized: 581,040 tokens
      # (DFlash2) / 965,166 (no drafter) @ 262K.
      DFLASH2: "${DFLASH2:-0}"
      DFLASH2_REVISION: "${DFLASH2_REVISION:-7d74cdd881ed7e32c31175984a67823127b66cfe}"
      # Use the vendored chat template that honors enable_thinking (upstream
      # commit 53912b4). 0 = fall back to the checkpoint's stock template,
      # which IGNORES the flag (thinking always on).
      TEMPLATE_FIX: "${TEMPLATE_FIX:-1}"
      # Thinking toggle — effective ONLY with TEMPLATE_FIX=1 (the stock
      # template ignores the flag and is structurally always-on). Default
      # true = the pre-fix serving behavior (all-recipes parity: thinking on
      # at REASONING_EFFORT); set false to actually turn thinking off now
      # that the vendored template honors it.
      THINKING: "${THINKING:-true}"
      DROP_CACHES: "${DROP_CACHES:-1}"
      # --enforce-eager: default torch.compile wedges multi-node GB10 (GLM and
      # Qwen-vLLM day-0 lesson). Keep on unless you have measured a fix.
      ENFORCE_EAGER: "${ENFORCE_EAGER:-1}"
      # Tool calling: GLM-5.3 uses the glm47 parser + glm45 reasoning parser.
      # reasoning_effort is always pinned server-side (undefined -> max, and
      # no-effort requests can degenerate: 800 tokens, no content). Clients
      # override per request via the OpenAI reasoning_effort field.
      # enable_thinking (THINKING env) is honored by the vendored template
      # (TEMPLATE_FIX=1, upstream 53912b4); the stock template ignores it.
      # See Tool-calling notes in README.
      REASONING_EFFORT: "${REASONING_EFFORT:-high}"
      TOOL_CALL_PARSER: "${TOOL_CALL_PARSER:-glm47}"
      REASONING_PARSER: "${REASONING_PARSER:-glm45}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        # Auto-detect the RoCE-v2 IPv4 GID index unless one is set in .env
        # (repo-wide pattern; the GID renumbers across reboots).
        if [ -z "$${NCCL_IB_GID_INDEX:-}" ]; then
          for HCA in $(echo "$${NCCL_IB_HCA}" | tr ',' ' '); do
            for i in $(seq 0 15); do
              t=$(cat /sys/class/infiniband/$$HCA/ports/1/gid_attrs/types/$$i 2>/dev/null || true)
              g=$(cat /sys/class/infiniband/$$HCA/ports/1/gids/$$i 2>/dev/null || true)
              case "$$t" in *"RoCE v2"*) case "$$g" in *0000:0000:0000:0000:0000:ffff:*) export NCCL_IB_GID_INDEX=$$i; break 2;; esac;; esac
            done
          done
        fi

        echo "[glm53] NODE_RANK=$${NODE_RANK} GID=$${NCCL_IB_GID_INDEX:-unset} kvmem=$${KV_CACHE_MEMORY:-4445787956} ctx=$${MAX_MODEL_LEN:-262144} dflash2=$${DFLASH2:-0}"

        # GB10 UMA page-cache guard: heavy file IO grows the page cache and
        # starves the NVRM allocator (MemFree, not MemAvailable, is what
        # counts). The authoritative step is the host-side ritual before
        # launch (README); this loop is belt-and-braces insurance during load.
        # DROP_CACHES=0 disables it (e.g. for debugging in a non-privileged
        # container). Output is detached so the loop can't hold the launch
        # stdout open.
        if [ "$${DROP_CACHES:-1}" = "1" ]; then
          ( while true; do
              c=$(awk '/^Cached:/{print int($2/1048576)}' /proc/meminfo 2>/dev/null || echo 0)
              if [ "$${c:-0}" -gt 40 ]; then sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; fi
              sleep 5
            done ) >/dev/null 2>&1 &
        fi

        # Resolve the model snapshot from the HF cache (offline serving).
        SNAP_ROOT="/cache/huggingface/hub/models--LibertAIDAI--GLM-5.3-Flash-NVFP4/snapshots"
        if [ -n "$${MODEL_REVISION:-}" ] && [ -d "$${SNAP_ROOT}/$${MODEL_REVISION}" ]; then
          MODEL_DIR="$${SNAP_ROOT}/$${MODEL_REVISION}"
        else
          # `|| true` keeps set -e from exiting on a missing snapshots dir
          # before the FATAL check below can print the real error.
          MODEL_DIR="$(ls -d $${SNAP_ROOT}/*/ 2>/dev/null | head -1 || true)"
        fi
        MODEL_DIR="$${MODEL_DIR%/}"
        test -f "$${MODEL_DIR}/config.json" || {
          echo "FATAL: LibertAIDAI/GLM-5.3-Flash-NVFP4 snapshot not found under $${SNAP_ROOT}." >&2
          echo "  Download it on BOTH nodes: hf download LibertAIDAI/GLM-5.3-Flash-NVFP4 --revision $${MODEL_REVISION:-main}" >&2
          exit 1
        }
        echo "[glm53] model dir: $${MODEL_DIR}"

        # Hard invariant from the tonyd2wild KV hunt: max-num-batched-tokens
        # below the DSA indexer's index_topk (2048) segfaults GLM-5.3 in
        # warmup. Fail fast instead of a silent segfault.
        if [ "$${MAX_NUM_BATCHED_TOKENS:-8192}" -lt 2048 ]; then
          echo "FATAL: MAX_NUM_BATCHED_TOKENS must be >= 2048 (DSA index_topk)"; exit 1
        fi

        EXTRA_ARGS=()
        [ "$${ENFORCE_EAGER:-1}" = "1" ] && EXTRA_ARGS+=(--enforce-eager)
        if [ "$${TEMPLATE_FIX:-1}" = "1" ]; then
          EXTRA_ARGS+=(--chat-template /opt/glm53/chat_template_mm.jinja)
        fi
        THINK_ARGS="{\"enable_thinking\": $${THINKING:-false}, \"reasoning_effort\": \"$${REASONING_EFFORT:-high}\"}"

        # Spec-decode selection: MTP (default, license-free) or DFlash2
        # (DFLASH2=1; 2.15x single-stream upstream, NON-COMMERCIAL drafter).
        KV_PIN="$${KV_CACHE_MEMORY:-4445787956}"
        if [ "$${DFLASH2:-0}" = "1" ]; then
          [ "$${SPEC_TOKENS:-3}" = "7" ] || { echo "FATAL: DFlash2 requires SPEC_TOKENS=7 (drafter block size 8 - 1)"; exit 1; }
          D2ROOT="/cache/huggingface/hub/models--incoai--GLM-5.3-Flash-DFlash2/snapshots"
          if [ -n "$${DFLASH2_REVISION:-}" ] && [ -d "$${D2ROOT}/$${DFLASH2_REVISION}" ]; then
            D2DIR="$${D2ROOT}/$${DFLASH2_REVISION}"
          else
            D2DIR="$(ls -d $${D2ROOT}/*/ 2>/dev/null | head -1 || true)"
          fi
          D2DIR="$${D2DIR%/}"
          test -f "$${D2DIR}/config.json" || {
            echo "FATAL: incoai/GLM-5.3-Flash-DFlash2 drafter not found under $${D2ROOT}." >&2
            echo "  Download on BOTH nodes: hf download incoai/GLM-5.3-Flash-DFlash2 --revision $${DFLASH2_REVISION:-main}" >&2
            echo "  NOTE: drafter license is CC-BY-NC-ND-4.0 (non-commercial use only)." >&2
            exit 1
          }
          if [ "$${KV_PIN}" = "4445787956" ]; then
            # Upstream's shipped DFlash2 pin is 3 GiB; keep it unless the
            # operator set KV_CACHE_MEMORY explicitly. The once-published
            # 7 GiB/727,583-token ceiling was WITHDRAWN upstream (2026-08-28):
            # pinned pools skip activation-headroom subtraction and die on
            # the first long prompt. Profiler-sized figure: 581,040 tokens @
            # 262K.
            KV_PIN="3221225472"
            echo "[glm53] DFLASH2=1: KV pin 3221225472 (3 GiB, upstream shipped value; set KV_CACHE_MEMORY to override)"
          fi
          SPEC_CFG="{\"method\":\"dflash\",\"model\":\"$${D2DIR}\",\"num_speculative_tokens\":7}"
          echo "[glm53] DFlash2 drafter: $${D2DIR}"
        else
          SPEC_CFG="{\"method\":\"mtp\",\"num_speculative_tokens\":$${SPEC_TOKENS:-3}}"
        fi
        exec vllm serve "$${MODEL_DIR}" \
          --revision "$${MODEL_REVISION:-main}" \
          --served-model-name "$${SERVED_MODEL_NAME:-glm-5.3-flash}" \
          --host 0.0.0.0 --port "$${PORT:-4000}" --trust-remote-code \
          --tensor-parallel-size "$${TP_SIZE:-2}" \
          --gpu-memory-utilization "$${GPU_MEM:-0.85}" \
          --max-model-len "$${MAX_MODEL_LEN:-262144}" \
          --max-num-seqs "$${MAX_NUM_SEQS:-6}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS:-8192}" \
          --block-size "$${BLOCK_SIZE:-2304}" \
          --moe-backend "$${MOE_BACKEND:-marlin}" \
          --kv-cache-dtype "$${KV_CACHE_DTYPE:-fp8_e4m3}" \
          --kv-cache-memory "$${KV_PIN}" \
          --speculative-config "$${SPEC_CFG}" \
          "$${EXTRA_ARGS[@]}" \
          --tool-call-parser "$${TOOL_CALL_PARSER:-glm47}" --enable-auto-tool-choice \
          --reasoning-parser "$${REASONING_PARSER:-glm45}" \
          --default-chat-template-kwargs "$${THINK_ARGS}" \
          --distributed-executor-backend mp \
          --nnodes 2 --node-rank "$${NODE_RANK}" \
          --master-addr "$${MASTER_ADDR}" --master-port "$${MASTER_PORT:-25000}" \
          $${HEADLESS:+--headless}
