services:
  mimo:
    build:
      context: ./patches
      dockerfile: Dockerfile
    image: vllm-node-mimo-v25-nvfp4:dflash-mimo-20260704
    container_name: mimo-v25-dflash
    network_mode: host
    ipc: host
    shm_size: 16g
    init: true
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    volumes:
      - /home/sdrew/.cache/huggingface:/root/.cache/huggingface
      - /home/sdrew/.cache/vllm-mimo-dflash:/cache
      - ./patches:/workspace/patches
      - ./mods:/workspace/mods
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    environment:
      # ---- GPU ----
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.83}

      # ---- RoCE networking (site-specific — match YOUR NICs) ----
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_PORTS}"
      NCCL_SOCKET_IFNAME: "${ETH_IF},${ETH_IF2}"
      GLOO_SOCKET_IFNAME: "${ETH_IF}"
      TP_SOCKET_IFNAME: "${ETH_IF}"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_NVLS_ENABLE: "0"
      NCCL_NET_GDR_LEVEL: LOC
      NCCL_DEBUG: WARN
      VLLM_HOST_IP: "${ROCE_IP}"
      NCCL_PROTO: LL
      NCCL_MAX_NCHANNELS: "2"

      # ---- NVFP4 weights backend ----
      VLLM_NVFP4_GEMM_BACKEND: flashinfer-cutlass
      VLLM_USE_FLASHINFER_MOE_FP4: "1"
      VLLM_FLASHINFER_MOE_BACKEND: throughput
      VLLM_NVFP4_INLINE: "1"
      VLLM_WMMA_DECODE: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

      # ---- memory / Ray stability ----
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      RAY_memory_monitor_refresh_ms: "0"
      VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "0"
      VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"

      # ---- model / serve ----
      # Pinned revision hashes from DEFAULT-CONFIG (HF commit-style hex hashes).
      # Download with: hf download ... --revision <hash>
      MODEL_REVISION: a147dd04d6cf861e43b2d783dcde23b53ab7ee68
      DFLASH_REVISION: 1f58446181abcaa01030fdbde835fbd38ae9a2b1
      SERVED_MODEL_NAME: mimo-v25-dflash
      PORT: "${PORT:-4000}"
      DFLASH_SPEC_TOKENS: ${DFLASH_SPEC_TOKENS:-7}
      ATTENTION_BACKEND: triton_attn
      KV_CACHE_DTYPE: fp8
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-500000}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-6}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-4096}
      BLOCK_SIZE: ${BLOCK_SIZE:-16}

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
      MASTER_ADDR: "${MASTER_ADDR}"
      ROCE_IP: "${ROCE_IP}"

    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        # ==============================================================
        # Auto-detect the RoCE-v2 IPv4 GID index (it re-numbers across
        # reboots).  Same logic as the deepseek-v4-flash-aiden recipe.
        # ==============================================================
        for HCA in $(echo "$${NCCL_IB_HCA}" | tr ',' ' '); do
          for i in $(seq 0 15); do
            t=$(cat /sys/class/infiniband/$$HCA/ports/1/gid_attrs/types/$$i 2>/dev/null || true)
            g=$(cat /sys/class/infiniband/$$HCA/ports/1/gids/$$i 2>/dev/null || true)
            case "$$t" in *"RoCE v2"*)
              case "$$g" in *0000:0000:0000:0000:0000:ffff:*)
                export NCCL_IB_GID_INDEX=$$i
                break 2
              ;; esac
            ;; esac
          done
        done

        echo "[mimo-dflash] NODE_RANK=$${NODE_RANK} DFLASH_SPEC_TOKENS=$${DFLASH_SPEC_TOKENS} GID=$${NCCL_IB_GID_INDEX:-unset}"

        # ==============================================================
        # Apply the 6 base mods (CRITICAL — without these the model
        # architecture won't be recognized).
        #
        # Mods are vendored in ./mods/ (from the companion repo).
        # Each mod dir has a run.sh that patches the in-container vLLM
        # installation.
        #
        # Mods list:
        #   drop-caches, ray-keep-node-nccl-hca,
        #   fix-prometheus-instrumentator-router,
        #   fix-mimo-v2-vllm  (registers MimoV2Config — REQUIRED),
        #   fix-modelopt-mixed-mxfp8,
        #   nvfp4-kv-diffkv
        # ==============================================================
        if [ ! -d /workspace/mods ]; then
          echo "FATAL: mods/ directory not mounted at /workspace/mods." >&2
          echo "  The 6 base mods are REQUIRED (especially fix-mimo-v2-vllm)." >&2
          echo "  All 6 base mods are vendored in this repo under ./mods/." >&2
          echo "  If the directory is missing, re-clone the repo to restore it." >&2
          echo "  on the host and restart." >&2
          exit 1
        fi

        for mod in drop-caches ray-keep-node-nccl-hca fix-prometheus-instrumentator-router \
                   fix-mimo-v2-vllm fix-modelopt-mixed-mxfp8 nvfp4-kv-diffkv; do
          if [ -f "/workspace/mods/$$mod/run.sh" ]; then
            echo "Applying mod: $$mod"
            bash "/workspace/mods/$$mod/run.sh"
          else
            echo "ERROR: mod $$mod not found at /workspace/mods/$$mod/run.sh" >&2
            echo "  All 6 base mods are vendored in this repo in ./mods/." >&2
            echo "  If the mods/ directory is incomplete, re-clone the repo." >&2
            exit 1
          fi
        done

        # ==============================================================
        # Apply the 7 engine patches (idempotent — each prints APPLIED or
        # "already patched").  These MUST be applied at runtime even on
        # the overlay image.
        # ==============================================================
        for p in patch_triton_noncausal patch_nc_fix patch_kv_page_lcm \
                 patch_aux_layer_off_by_one patch_diffkv_noncausal \
                 patch_draft_cache_auto patch_spec_dtype_guard; do
          echo "Applying engine patch: $$p"
          python3 "/workspace/patches/$$p.py" || echo "  (patch $$p may already be applied — continuing)"
        done

        # ==============================================================
        # Start Ray
        # ==============================================================
        export RAY_TMPDIR="$${RAY_TMPDIR:-/dev/shm/ray}"
        mkdir -p "$${RAY_TMPDIR}"

        if [ "$${NODE_RANK}" = "0" ]; then
          # ---- HEAD node (serves vLLM) ----
          ray stop --force 2>/dev/null || true
          ray start --head --port=6379 \
            --node-ip-address="$${ROCE_IP}" \
            --dashboard-host=0.0.0.0 \
            --num-gpus=1 \
            --object-store-memory=1073741824

          echo "Ray head up on $${ROCE_IP}:6379. Waiting for worker GPU..."
          until ray status 2>/dev/null | grep -qE '2\.0/2\.0 GPU|2\.0 GPU'; do sleep 2; done
          echo "Both GPUs joined. Launching vLLM..."

          # Resolve snapshot paths from pinned revision hashes
          HF_BASE=/root/.cache/huggingface/hub
          MODEL_SNAPSHOT_DIR="$${HF_BASE}/models--lukealonso--MiMo-V2.5-NVFP4/snapshots/$${MODEL_REVISION}"
          DFLASH_SNAPSHOT_DIR="$${HF_BASE}/models--XiaomiMiMo--MiMo-V2.5-DFlash/snapshots/$${DFLASH_REVISION}"

          if [ ! -d "$$MODEL_SNAPSHOT_DIR" ]; then
            echo "ERROR: MiMo-V2.5-NVFP4 snapshot $${MODEL_REVISION} not found." >&2
            echo "  Expected: $${MODEL_SNAPSHOT_DIR}" >&2
            echo "  Download: hf download lukealonso/MiMo-V2.5-NVFP4 --revision $${MODEL_REVISION}" >&2
            exit 1
          fi
          if [ ! -d "$$DFLASH_SNAPSHOT_DIR" ]; then
            echo "ERROR: MiMo-V2.5-DFlash snapshot $${DFLASH_REVISION} not found." >&2
            echo "  Expected: $${DFLASH_SNAPSHOT_DIR}" >&2
            echo "  Download: hf download XiaomiMiMo/MiMo-V2.5-DFlash --revision $${DFLASH_REVISION} --include 'dflash/*'" >&2
            exit 1
          fi

          # Verify the dflash/ subdir exists in the drafter snapshot
          if [ ! -d "$${DFLASH_SNAPSHOT_DIR}/dflash" ]; then
            echo "ERROR: dflash/ subdirectory not found in drafter snapshot." >&2
            echo "  Re-download with: hf download ... --include 'dflash/*'" >&2
            exit 1
          fi

          MODEL_PATH="$${MODEL_SNAPSHOT_DIR}"
          DFLASH_MODEL_PATH="$${DFLASH_SNAPSHOT_DIR}/dflash"

          echo "MODEL_PATH=$${MODEL_PATH}"
          echo "DFLASH_MODEL_PATH=$${DFLASH_MODEL_PATH}"

          SPEC_CONFIG="{\"model\":\"$${DFLASH_MODEL_PATH}\",\"method\":\"dflash\",\"num_speculative_tokens\":$${DFLASH_SPEC_TOKENS}}"

          exec vllm serve "$${MODEL_PATH}" \
            --served-model-name "$${SERVED_MODEL_NAME}" \
            --trust-remote-code --dtype auto \
            --tensor-parallel-size 2 \
            --distributed-executor-backend ray \
            --load-format safetensors \
            --hf-overrides '{"architectures":["MiMoV2ForCausalLM"]}' \
            --attention-backend "$${ATTENTION_BACKEND}" \
            --kv-cache-dtype "$${KV_CACHE_DTYPE}" \
            --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}" \
            --max-model-len "$${MAX_MODEL_LEN}" \
            --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS}" \
            --max-num-seqs "$${MAX_NUM_SEQS}" \
            --block-size "$${BLOCK_SIZE}" \
            --enable-prefix-caching \
            --enable-chunked-prefill \
            --generation-config vllm \
            --override-generation-config '{"temperature":0,"top_p":0.95}' \
            --speculative-config "$${SPEC_CONFIG}" \
            --enforce-eager \
            --enable-auto-tool-choice --tool-call-parser mimo --reasoning-parser mimo \
            --host 0.0.0.0 --port "$${PORT}"

        else
          # ---- WORKER node (Ray only) ----
          ray stop --force 2>/dev/null || true
          ray start \
            --address="$${MASTER_ADDR}:6379" \
            --node-ip-address="$${ROCE_IP}" \
            --num-gpus=1 \
            --object-store-memory=1073741824

          echo "Ray worker joined $${MASTER_ADDR}:6379. Container staying alive."
          sleep infinity
        fi
